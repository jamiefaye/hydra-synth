<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Herder, two loops</title>
    <style>
      body { margin: 0; background: black; color: #ccc; font-family: monospace; font-size: 12px; overflow: hidden; }
      canvas { width: 100vw; height: 100vh; display: block; object-fit: contain; background: black; }
      #hud { position: fixed; left: 8px; bottom: 8px; font-size: 11px; }
      #hudhead { background: rgba(0,0,0,0.55); padding: 3px 6px; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
      #headtext { white-space: pre-wrap; }
      #hudhead select, #hudhead input, #editor textarea, #editor button, #editor label { font: inherit; background: #111; color: #ddd; border: 1px solid #444; }
      #editor { display: none; background: rgba(0,0,0,0.7); padding: 6px 8px; margin-bottom: 4px; }
      #editor textarea { width: 60em; height: 7em; display: block; margin: 4px 0; }
      #editor .err { color: #f88; }
      #editor label { border: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="hudhead">
        <span id="seedbox">seed <select id="seed">
          <option value="osc">osc + kaleid</option>
          <option value="noise">noise</option>
          <option value="voronoi">voronoi</option>
          <option value="cam">camera</option>
          <option value="screen">screen</option>
          <option value="video">video url</option>
          <option value="image">image url</option>
          <option value="sketch">sketch (e to edit)</option>
        </select> <input id="url" placeholder="url" size="24" style="display:none" /></span>
        <a href="manual.html" target="_blank" style="color:#9cf">manual</a>
        <span id="headtext">loading</span>
      </div>
      <div id="editor">
        <div>Hydra code. <label><input type="radio" name="emode" value="seed" checked /> seed: a chain (no out() needed) that becomes the seed on o2, loops untouched</label>
        <label><input type="radio" name="emode" value="seedb" /> seed B: the same for loop B's own seed (o4)</label>
        <label><input type="radio" name="emode" value="raw" /> roughshod: run as-is, anything goes (b rebuilds the loops)</label>
        <span style="float:right">ctrl+enter apply, esc close</span></div>
        <textarea id="code" spellcheck="false">osc(12, 0.05, 1).kaleid(5).rotate(() => time * 0.1)</textarea>
        <button id="apply">apply</button> <span id="everr" class="err"></span>
      </div>
      <div id="panel"></div>
    </div>
    <script type="module">
      // Two Light Herder loops on the EC4.
      //   o0 loop A (GR01)   o1 loop B (GR02)   o2 the seed   o3 program = A crossfaded with B (GR03 XFAD)   o4 loop B's own seed (SEED KndB)
      //   GR03 switcher panel: cross-links, luma keys, crossfade, period, seed delay, freezes, grid
      //   GR04 monitors: hue/sat/brightness/contrast of the four monitors (A direct, A mirror, B direct, B mirror)
      // Query: mode = gl | gpu, seed = osc|noise|voronoi|cam|screen|video|image, url = for video/image, h = hide hud,
      //   res = WxH (the loops' resolution for the run; default the display's device pixels), panel = window
      //   float = 0 for 8-bit outputs (default half-float: the loops keep headroom and fine steps between frames)
      const q = new URLSearchParams(location.search)
      const mode = q.get('mode') || 'gpu'
      const canvas = document.getElementById('c')
      const hud = document.getElementById('hud')
      // The resolution is fixed for the run, as on a real rig: the window shows it letterboxed and a
      // resize rescales the view instead of emptying the frame ring. Default: the display's device
      // pixels (3840x2160 on a 4K screen at Retina scaling); ?res=1920x1080 for a weaker machine.
      const dpr = window.devicePixelRatio || 1
      const resq = /^(\d+)x(\d+)$/.exec(q.get('res') || '')
      const W = Math.min(7680, resq ? +resq[1] : Math.round(window.innerWidth * dpr))
      const H = Math.min(4320, resq ? +resq[2] : Math.round(window.innerHeight * dpr))
      canvas.width = W; canvas.height = H

      const { createHydra } = await import('../extensions/vertex/index-webgpu.js')
      const { install, ec4 } = await import('../extensions/midi/index.js')
      const { mountPanel } = await import('../extensions/midi/ui/panel.js')
      const hydra = await createHydra({ canvas, width: W, height: H, detectAudio: false, makeGlobal: true, numOutputs: 5, filter: 'linear', float: q.get('float') !== '0', useWGSL: mode === 'gpu' })
      window.__hydra = hydra
      if (hydra._vertexResizeObserver) { hydra._vertexResizeObserver.disconnect(); delete hydra._vertexResizeObserver }   // the window may change; the loops do not
      // frames per second, from the page's own animation frames
      let fps = 0; { let n = 0, t0 = performance.now(); const count = (t) => { n++; if (t - t0 >= 1000) { fps = Math.round(n * 1000 / (t - t0)); n = 0; t0 = t } requestAnimationFrame(count) }; requestAnimationFrame(count) }
      const midi = await install(hydra, { profile: ec4, sysex: true })   // sysex: click a group on screen and the EC4 goes there (knobs work without it)

      // ---- controls, as labelled on the device (dev/herder-ec4-labels.json)
      // Groups by what a knob belongs to (camera, switcher, monitor, seed, rig), after Rust's split;
      // PLAY is a view: aliases of the knobs a set rides, one value in two places (midi.alias).
      // Label case says what the finger does: UPPER = a knob you turn (push = fine where it has it),
      // Capitalised = a switch you turn, lowercase = a push-only button. Same on the EC4's OLED.
      const pad = (a) => a.concat(Array(16 - a.length).fill('----'))
      const CAM  = pad(['GAIN','ZOOM','ROT','X','Y','BLUR','DLAY','PRST','PTCH','YAW','LENS','PDLY']); CAM[15] = 'home'
      const SW   = pad(['XFAD','PERI','Rvrs','Frza','Frzb','Grid','Void','GLID','rec','clr']); SW[15] = 'view'
      const MON  = []; for (let m = 1; m <= 4; m++) MON.push(`${m}HUE`, `${m}SAT`, `${m}BRT`, `${m}CON`)
      const SEED = pad(['LEVA','S2A','SFRQ','SKAL','S1B','LEVB','FRQB','KALB','Kind','KndB','SDLY','----','cuta','cutb','cutx'])
      const RIG  = pad(['MIRA','MZMA','MIRB','MZMB','AtoB','BtoA','KEYA','KEYB'])
      const PLAY = pad(['GNA','ZMA','RTA','LVA','GNB','ZMB','RTB','LVB','XFAD','PERI','SDLY','Void','SKAL','RBTH','ZBTH','Cntr'])
      const GROUPS = { 1: CAM, 2: CAM, 3: SW, 4: MON, 5: SEED, 6: RIG, 7: PLAY }

      const camControls = (g) => ({   // key order = CAM label order (the dump relies on it)
        gain:   midi.cc([g, 1], { min: 0.8, max: 1.25, init: 1, curve: 'log', steps: 200, fine: 10 }),
        zoom:   midi.cc([g, 2], { min: 0.5, max: 2, init: 1.02, curve: 'log', steps: 300, fine: 10 }),   // unity mid-travel, ~0.5% a detent (Rust's step)
        rot:    midi.cc([g, 3], { min: 0, max: 6.283, init: 0.02, wrap: true, steps: 360, fine: 10 }),
        x:      midi.cc([g, 4], { min: -0.2, max: 0.2, init: 0, steps: 200, fine: 10 }),
        y:      midi.cc([g, 5], { min: -0.2, max: 0.2, init: 0, steps: 200, fine: 10 }),
        blur:   midi.cc([g, 6], { min: 0, max: 0.02, init: 0, curve: 'exp', steps: 100, fine: 10 }),   // 0 = sharp lens (bilinear sampling still softens a fraction of a texel)
        delay:  midi.cc([g, 7], { min: 1, max: 29, init: 1, steps: 28 }),
        persist: midi.cc([g, 8], { min: 0, max: 1, init: 0, steps: 100 }),
        pitch:  midi.cc([g, 9], { min: -0.7, max: 0.7, init: 0, steps: 200, fine: 10 }),
        yaw:    midi.cc([g, 10], { min: -0.7, max: 0.7, init: 0, steps: 200, fine: 10 }),
        lens:   midi.cc([g, 11], { min: 1, max: 6, init: 2.5, curve: 'log', steps: 100, fine: 10 }),
        pdly:   midi.cc([g, 12], { min: 1, max: 29, init: 15, steps: 28 })
      })
      const A = camControls(1)
      const B = camControls(2)
      // HOME (push on encoder 16): the camera square on the monitor again. Pose only; gain, blur,
      // delay and lens are the loop's character, not where the camera points.
      const POSE = ['zoom', 'rot', 'x', 'y', 'pitch', 'yaw']
      const home = (L) => { for (const k of POSE) L[k].reset(); midi.refresh() }
      const homePush = [midi.note([1, 16], { toggle: true }), midi.note([2, 16], { toggle: true })]
      const lastHome = homePush.map(f => f())
      const S = {   // switchers: what is played
        xfad: midi.cc([3, 1], { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        peri: midi.cc([3, 2], { min: 0, max: 8, init: 0, steps: 64 }),   // seconds, 0 = off
        rvrs: midi.cc([3, 3], { min: 0, max: 1, init: 0, steps: 1 }),
        frza: midi.cc([3, 4], { min: 0, max: 1, init: 0, steps: 1 }),
        frzb: midi.cc([3, 5], { min: 0, max: 1, init: 0, steps: 1 }),
        grid: midi.cc([3, 6], { min: 0, max: 1, init: 0, steps: 1 }),
        void: midi.cc([3, 7], { min: 0, max: 1, init: 1, steps: 1 }),   // black beyond the monitor (srcb/blurb) or wrap (src/blur)
        glid: midi.cc([3, 8], { min: 0, max: 30, init: 0, steps: 120 })  // seconds an opened patch takes to arrive
      }
      // Two seeds into two loops, a 2 x 2 matrix: rows are the loops, columns the seeds, and it sits as a block
      // at the top left of the group with each seed's own knobs to its right.
      //   LEVA  S2A  | SFRQ SKAL      loop A takes seed 1 (LEVA) and seed 2 (S2A)      seed 1: frequency, kaleid
      //   S1B   LEVB | FRQB KALB      loop B takes seed 1 (S1B) and seed 2 (LEVB)      seed 2: frequency, kaleid
      //   Kind  KndB   SDLY           what each seed is; KndB 0 = seed 2 is seed 1 again, which costs nothing
      //   cuta  cutb   cutx           (key order below = label order; the dump and the patches rely on it)
      const SD = {
        leva: midi.cc([5, 1], { min: 0, max: 1, init: 0.08, steps: 100, fine: 10 }),
        s2a:  midi.cc([5, 2], { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        sfrq: midi.cc([5, 3], { min: 1, max: 60, init: 8, curve: 'log', steps: 100 }),
        skal: midi.cc([5, 4], { min: 0, max: 12, init: 0, steps: 12 }),   // 0 = the seed as itself
        s1b:  midi.cc([5, 5], { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        levb: midi.cc([5, 6], { min: 0, max: 1, init: 0.08, steps: 100, fine: 10 }),
        frqb: midi.cc([5, 7], { min: 1, max: 60, init: 8, curve: 'log', steps: 100 }),
        kalb: midi.cc([5, 8], { min: 0, max: 12, init: 0, steps: 12 }),
        kind: midi.cc([5, 9], { min: 0, max: 5, init: 0, steps: 5 }),    // seed 1: osc noise voronoi cam screen sketch
        kndb: midi.cc([5, 10], { min: 0, max: 6, init: 0, steps: 6 }),   // seed 2: 0 = seed 1 again, then osc noise voronoi cam screen sketch
        sdly: midi.cc([5, 11], { min: 1, max: 29, init: 1, steps: 28 })
      }
      // cut: the switcher's foot pedal. While held the seed goes in whole (cuta, cutb) or the program flips to
      // its other end (cutx); on release the knob's value stands again and what was dropped in echoes round.
      const CUT = { a: midi.note([5, 13]), b: midi.note([5, 14]), x: midi.note([5, 15]) }
      const R = {   // the rig: glass and cabling, set per piece
        mira: midi.cc([6, 1], { min: 0, max: 1, init: 0.35, steps: 100, fine: 10 }),
        mzma: midi.cc([6, 2], { min: 0.5, max: 2, init: 0.9, curve: 'log', steps: 100, fine: 10 }),
        mirb: midi.cc([6, 3], { min: 0, max: 1, init: 0.35, steps: 100, fine: 10 }),
        mzmb: midi.cc([6, 4], { min: 0.5, max: 2, init: 0.9, curve: 'log', steps: 100, fine: 10 }),
        atob: midi.cc([6, 5], { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        btoa: midi.cc([6, 6], { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        keya: midi.cc([6, 7], { min: 0, max: 1, init: 0.35, steps: 100, fine: 10 }),
        keyb: midi.cc([6, 8], { min: 0, max: 1, init: 0.35, steps: 100, fine: 10 })
      }
      // PLAY: the knobs a set rides, aliased from their homes (turn either, both displays follow)
      const playOf = [[1, 1], [1, 2], [1, 3], [5, 1], [2, 1], [2, 2], [2, 3], [5, 6], [3, 1], [3, 2], [5, 11], [3, 7], [5, 4]]
      playOf.forEach((home, i) => midi.alias([7, i + 1], home))
      const PL = {   // PLAY's own knobs: both cameras at once, on top of each one's ROT and ZOOM
        rbth: midi.cc([7, 14], { min: 0, max: 6.283, init: 0, wrap: true, steps: 360, fine: 10 }),
        zbth: midi.cc([7, 15], { min: 0.5, max: 2, init: 1, curve: 'log', steps: 300, fine: 10 }),
        cntr: midi.cc([7, 16], { min: 0, max: 1, init: 0, steps: 1 })   // contra: camera B takes them the other way
      }
      const mon = (m) => ({
        hue: midi.cc([4, (m - 1) * 4 + 1], { min: -0.5, max: 0.5, init: 0, steps: 100, fine: 10 }),
        sat: midi.cc([4, (m - 1) * 4 + 2], { min: 0, max: 2, init: 1, steps: 100, fine: 10 }),
        brt: midi.cc([4, (m - 1) * 4 + 3], { min: -0.5, max: 0.5, init: 0, steps: 100, fine: 10 }),
        con: midi.cc([4, (m - 1) * 4 + 4], { min: 0.5, max: 2, init: 1, curve: 'log', steps: 100, fine: 10 })
      })
      const M = [null, mon(1), mon(2), mon(3), mon(4)]   // 1 = A direct, 2 = A mirror, 3 = B direct, 4 = B mirror
      const P = { A, B, S, M, SD, R, PL, CUT }
      // every knob by group and label, as the HUD names them; and flat, 'CAMA.ZOOM' -> the knob
      const KNOBS = {
        CAMA: Object.fromEntries(Object.values(A).map((f, i) => [CAM[i], f])), CAMB: Object.fromEntries(Object.values(B).map((f, i) => [CAM[i], f])),
        SWCH: Object.fromEntries(Object.values(S).map((f, i) => [SW[i], f])), SEED: Object.fromEntries(Object.values(SD).map((f, i) => [SEED[i], f])),
        RIG: Object.fromEntries(Object.values(R).map((f, i) => [RIG[i], f])), PLAY: { RBTH: PL.rbth, ZBTH: PL.zbth, Cntr: PL.cntr },
        MONS: Object.fromEntries([1, 2, 3, 4].flatMap(m => ['hue', 'sat', 'brt', 'con'].map(k => [`${m}${k.toUpperCase()}`, M[m][k]])))
      }
      const flat = {}
      for (const [g, ks] of Object.entries(KNOBS)) for (const [label, f] of Object.entries(ks)) flat[`${g}.${label}`] = f
      // herder: the page's own mechanism, for sketches and roughshod code to reach into. A seed may read a knob
      // (osc(() => herder.k['CAMA.ZOOM']() * 20)); roughshod code may set them, glide, record. Filled in further down.
      window.herder = { k: flat, knobs: KNOBS, out: { a: o0, b: o1, seed: o2, program: o3, seedB: o4 } }

      o0.setDepth(30); o1.setDepth(30); o2.setDepth(30)

      // ---- the seed (what the switcher's external input shows)
      const seedSel = document.getElementById('seed')
      const urlBox = document.getElementById('url')
      let seedKind = q.get('seed') || 'osc'
      let seedUrl = q.get('url') || ''
      seedSel.value = seedKind; urlBox.value = seedUrl
      const srcKind = { s0: null, s1: null }
      const ensureSource = (kind, sN = s0, slot = 's0') => {
        const want = (kind === 'video' || kind === 'image') ? kind + ':' + seedUrl : kind
        if (srcKind[slot] === want) return
        if (kind === 'cam') sN.initCam(); else if (kind === 'screen') sN.initScreen()
        else if (kind === 'video') { if (!seedUrl) return; sN.initVideo(seedUrl) } else if (kind === 'image') { if (!seedUrl) return; sN.initImage(seedUrl) } else return
        srcKind[slot] = want
      }
      // ---- user code: a seed expression for A, one for B, or roughshod. One text box, three texts.
      const editor = document.getElementById('editor'), codeBox = document.getElementById('code'), everr = document.getElementById('everr')
      const codes = { seed: codeBox.value, seedb: 'shape(4, 0.3, 0.01).rotate(() => time * 0.2)', raw: '' }
      const CODE_KEYS = { seed: 'herder.code', seedb: 'herder.codeB', raw: 'herder.codeRaw' }
      for (const k of Object.keys(codes)) { try { const saved = localStorage.getItem(CODE_KEYS[k]); if (saved) codes[k] = saved } catch (e) { /* no storage */ } }
      const editMode = () => document.querySelector('input[name=emode]:checked').value
      let shownCode = editMode(); codeBox.value = codes[shownCode]
      const keepCode = () => { codes[shownCode] = codeBox.value; try { localStorage.setItem(CODE_KEYS[shownCode], codeBox.value) } catch (e) { /* no storage */ } }
      document.querySelectorAll('input[name=emode]').forEach(r => r.addEventListener('change', () => { keepCode(); shownCode = editMode(); codeBox.value = codes[shownCode] }))
      const evalSeed = (text) => {
        // seed mode: a chain; a trailing .out(...) is a habit, so strip it (the page chooses the output)
        const chain = (0, eval)(text.trim().replace(/\.out\s*\([^)]*\)\s*;?\s*$/, ''))
        if (!chain || typeof chain.out !== 'function') throw new Error('seed code must be a chain, e.g. osc(10).kaleid(4)')
        return chain
      }
      // a seed: its kind, its frequency and kaleid knobs, its sketch text, its external source
      const kalOf = (knob) => Math.round(knob()) >= 2
      const seedChainOf = (kind, frq, kalKnob, code, sN, slot) => {
        const kal = (chain) => kalOf(kalKnob) ? chain.kaleid(() => Math.max(2, Math.round(kalKnob()))) : chain
        switch (kind) {
          case 'sketch': {
            try { everr.textContent = ''; return kal(evalSeed(code)) } catch (e) { everr.textContent = e.message; return kal(osc(frq, 0.05, 1)) }
          }
          case 'noise': return kal(noise(frq, 0.1).brightness(0.4).contrast(1.6))
          case 'voronoi': return kal(voronoi(frq, 0.3, 0.3))
          case 'cam': case 'screen': case 'video': case 'image': ensureSource(kind, sN, slot); return kal(src(sN))
          default: return kal(osc(frq, 0.05, 1))
        }
      }
      const seedOrderB = ['same', 'osc', 'noise', 'voronoi', 'cam', 'screen', 'sketch']
      const seedKindB = () => seedOrderB[Math.round(SD.kndb())] || 'same'
      // the seed as seen by a loop, delayed by SDLY frames: o2, or for loop B its own seed on o4
      const seedTexA = () => o2.delay(() => Math.round(SD.sdly()))
      const seedTexB = () => seedKindB() === 'same' ? seedTexA() : o4.delay(() => Math.round(SD.sdly()))

      // ---- one loop: own output, own controls, the other loop's output for the cross-link
      const monitor = (chain, m) => chain.hue(M[m].hue).saturate(M[m].sat).brightness(M[m].brt).contrast(M[m].con)
      const loop = (self, other, L, monDirect, monMirror, glass, link, key, seeds) => {
        const dark = S.void() > 0.5                              // a camera sees an unlit room past the monitor
        const seen = () => self.delay(() => Math.round(L.delay()))
        const lens = () => L.blur() > 0 ? (dark ? blurb : blur)(seen(), L.blur) : (dark ? srcb : src)(seen())   // focus at 0 = the sampler alone
        // one camera, one pose: it turns and slides as a whole, so the monitor in the glass moves with the one seen direct
        // RBTH and ZBTH ride on top for both cameras; with Cntr camera B takes them the other way
        const contra = () => L === B && PL.cntr() > 0.5
        const zoom = () => L.zoom() * (contra() ? 1 / PL.zbth() : PL.zbth())
        const rot = () => L.rot() + (contra() ? -1 : 1) * PL.rbth()
        const pose = (chain) => chain.scale(zoom).offset(L.x, L.y).tilt(L.pitch, L.yaw, L.lens).rotate(rot)
        const direct = pose(monitor(lens(), monDirect))
        const reflected = pose(monitor(lens().scale(glass.mzm, -1, 1), monMirror))
        let chain = direct
          .blend(reflected, glass.mirror)                      // beam splitter: the two halves sum to one
          .blend(src(other), link)                             // cross-link from the other loop
          .color(L.gain, L.gain, L.gain)                       // loop gain: exposure, a gain about black (contrast pivots on mid-grey and crushes the echoes)
          .knee(2)                                             // the rails: past white the signal bends onto 2 instead of running (float outputs keep the reserve)
          .blend(src(self.delay(() => Math.round(L.pdly()))), L.persist)   // PRST at PDLY frames back
        for (const { tex, amount } of seeds) {
          // keyed: a seed replaces pixels only where its luminance passes the key (issue 71 in lightherder); else crossfaded
          chain = key() > 0.005 ? chain.layer(src(tex()).luma(key, 0.1).mult(solid(1, 1, 1, amount), 1)) : chain.blend(src(tex()), amount)
        }
        return chain
      }

      // ---- build everything (called again when a chain's shape changes: seed kind, kaleid, key, freeze)
      let built = {}
      const shape = () => JSON.stringify({ seedKind, kal: kalOf(SD.skal), sb: seedKindB(), kalb: kalOf(SD.kalb), s2a: SD.s2a() > 0.001, s1b: SD.s1b() > 0.001, bla: A.blur() > 0, blb: B.blur() > 0, keya: R.keya() > 0.005, keyb: R.keyb() > 0.005, fa: S.frza() > 0.5, fb: S.frzb() > 0.5, rv: S.rvrs() > 0.5, vd: S.void() > 0.5 })
      const build = () => {
        seedChainOf(seedKind, SD.sfrq, SD.skal, codes.seed, s0, 's0').out(o2)
        const ownB = seedKindB() !== 'same'   // o4 keeps a thirty-frame ring only while loop B has a seed of its own
        if (ownB) { if (o4.depth !== 30) o4.setDepth(30); seedChainOf(seedKindB(), SD.frqb, SD.kalb, codes.seedb, s1, 's1').out(o4) } else { if (o4.depth !== 2) o4.setDepth(2); solid(0, 0, 0, 1).out(o4) }
        const lev = (knob, cut) => () => cut() ? 1 : knob()
        // the matrix: a loop's own seed first (with its cut), then the other seed if its knob is up at all
        const seedsA = [{ tex: seedTexA, amount: lev(SD.leva, CUT.a) }].concat(SD.s2a() > 0.001 ? [{ tex: seedTexB, amount: SD.s2a }] : [])
        const seedsB = [{ tex: seedTexB, amount: lev(SD.levb, CUT.b) }].concat(SD.s1b() > 0.001 ? [{ tex: seedTexA, amount: SD.s1b }] : [])
        const swap = S.rvrs() > 0.5
        const [oa, ob] = swap ? [o1, o0] : [o0, o1]
        if (S.frza() > 0.5) src(o0.delay(1)).out(o0); else loop(oa, ob, A, 1, 2, { mirror: R.mira, mzm: R.mzma }, R.btoa, R.keya, seedsA).out(o0)

        })
        if ('sequence' in state && state.sequence !== undefined) part('sequence', () => startSequence(state.sequence, state.loop))
        for (const [key, slot] of [['code', 'seed'], ['codeB', 'seedb']]) {
          if (typeof state[key] !== 'string') continue
          codes[slot] = state[key]; if (shownCode === slot) codeBox.value = state[key]
          try { localStorage.setItem(CODE_KEYS[slot], state[key]) } catch (e) { /* no storage */ }
        }
        const kind = state.seed && state.seed.kind
        if (kind && SEED_KINDS.includes(kind)) part('seed', () => { lastKindKnob = Math.round(SD.kind()); setSeed(kind, typeof state.seed.url === 'string' ? state.seed.url : '') })   // rebuilds the loops
        else { if (kind) skipped.push(`seed.kind ${kind}`); if ((typeof state.code === 'string' && seedKind === 'sketch') || typeof state.codeB === 'string') part('code', build) }
        if (state.view) { if (views[state.view]) part('view', () => setView(state.view)); else skipped.push(`view ${state.view}`) }
        part('refresh', () => midi.refresh())
        return skipped
      }
      const PATCH_TYPES = [{ description: 'Herder patch', accept: { 'application/json': ['.json'] } }]
      const savePatch = async () => {
        const text = JSON.stringify(stateOf(), null, 2)
        const name = `herder-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.json`
        try {
          if (!window.showSaveFilePicker) throw new Error('no picker')
          const handle = await window.showSaveFilePicker({ id: 'herder', suggestedName: name, types: PATCH_TYPES })
          const w = await handle.createWritable(); await w.write(text); await w.close()
          say('saved ' + handle.name)
        } catch (e) {
          if (e.name === 'AbortError') return
          const a = document.createElement('a')   // no File System Access (or no user gesture): a download
          a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; a.click()
          setTimeout(() => URL.revokeObjectURL(a.href), 1000)
          say('downloaded ' + name)
        }
      }
      const loadPatchFile = async (file) => {
        try { const skipped = applyState(JSON.parse(await file.text())); say('opened ' + file.name + (skipped.length ? '  (skipped: ' + skipped.join(', ') + ')' : '')) } catch (e) { say(`${file.name} is not JSON, nothing changed (${e.message})`) }
      }
      const openPatch = async () => {
        try {
          if (!window.showOpenFilePicker) throw new Error('no picker')
          const [handle] = await window.showOpenFilePicker({ id: 'herder', types: PATCH_TYPES })
          loadPatchFile(await handle.getFile())
        } catch (e) {
          if (e.name === 'AbortError') return
          const input = document.createElement('input'); input.type = 'file'; input.accept = '.json,application/json'
          input.onchange = () => { if (input.files[0]) loadPatchFile(input.files[0]) }
          input.click()
        }
      }
      document.addEventListener('dragover', (e) => e.preventDefault())
      document.addEventListener('drop', (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadPatchFile(f) })
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return
        if (e.key === 'd') dump(); if (e.key === 'w') savePatch(); if (e.key === 'o') openPatch()
        if (e.key === 'g') { if (auto.rec) stopRec(); else startRec() } if (e.key === 'G') stopAuto()
      })
      Object.assign(window.herder, { apply: applyState, glideTo, record: startRec, loop: stopRec, stop: stopAuto, sequence: startSequence, auto, state: stateOf, tick: autoTick })
      window.__herder = { P, midi, get panel () { return panel }, openPanelWindow, closePanelWindow, setSeed, setView, build, dump, stateOf, applyState, savePatch, openPatch, applyCode, codeBox, get seedKind () { return seedKind }, get view () { return view } }
    </script>
  </body>
