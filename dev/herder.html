<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Herder, two loops</title>
    <style>
      body { margin: 0; background: black; color: #ccc; font-family: monospace; font-size: 12px; overflow: hidden; }
      canvas { width: 100vw; height: 100vh; display: block; }
      #hud { position: fixed; left: 8px; bottom: 8px; font-size: 11px; }
      #hudhead { background: rgba(0,0,0,0.55); padding: 3px 6px; margin-bottom: 4px; white-space: pre; display: flex; gap: 12px; align-items: center; }
      #hudhead select, #hudhead input, #editor textarea, #editor button, #editor label { font: inherit; background: #111; color: #ddd; border: 1px solid #444; }
      #editor { display: none; background: rgba(0,0,0,0.7); padding: 6px 8px; margin-bottom: 4px; }
      #editor textarea { width: 60em; height: 7em; display: block; margin: 4px 0; }
      #editor .err { color: #f88; }
      #editor label { border: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="hudhead">
        <span id="headtext">loading</span>
        <span>seed <select id="seed">
          <option value="osc">osc + kaleid</option>
          <option value="noise">noise</option>
          <option value="voronoi">voronoi</option>
          <option value="cam">camera</option>
          <option value="screen">screen</option>
          <option value="video">video url</option>
          <option value="image">image url</option>
          <option value="sketch">sketch (e to edit)</option>
        </select> <input id="url" placeholder="url" size="24" style="display:none" /></span>
      </div>
      <div id="editor">
        <div>Hydra code. <label><input type="radio" name="emode" value="seed" checked /> seed: a chain (no out() needed) that becomes the seed on o2, loops untouched</label>
        <label><input type="radio" name="emode" value="raw" /> roughshod: run as-is, anything goes (b rebuilds the loops)</label>
        <span style="float:right">ctrl+enter apply, esc close</span></div>
        <textarea id="code" spellcheck="false">osc(12, 0.05, 1).kaleid(5).rotate(() => time * 0.1)</textarea>
        <button id="apply">apply</button> <span id="everr" class="err"></span>
      </div>
      <div id="panel"></div>
    </div>
    <script type="module">
      // Two Light Herder loops on the EC4.
      //   o0 loop A (GR01)   o1 loop B (GR02)   o2 the seed   o3 program = A crossfaded with B (GR03 XFAD)
      //   GR03 switcher panel: cross-links, luma keys, crossfade, period, seed delay, freezes, grid
      //   GR04 monitors: hue/sat/brightness/contrast of the four monitors (A direct, A mirror, B direct, B mirror)
      // Query: mode = gl | gpu, seed = osc|noise|voronoi|cam|screen|video|image, url = for video/image, h = hide hud
      const q = new URLSearchParams(location.search)
      const mode = q.get('mode') || 'gpu'
      const canvas = document.getElementById('c')
      const hud = document.getElementById('hud')
      canvas.width = 1280; canvas.height = 720

      const { createHydra } = await import('../extensions/vertex/index-webgpu.js')
      const { install, ec4 } = await import('../extensions/midi/index.js')
      const { mountPanel } = await import('../extensions/midi/ui/panel.js')
      const hydra = await createHydra({ canvas, width: 1280, height: 720, detectAudio: false, makeGlobal: true, numOutputs: 4, useWGSL: mode === 'gpu' })
      window.__hydra = hydra
      const midi = await install(hydra, { profile: ec4 })

      // ---- controls, as labelled on the device (dev/herder-ec4-labels.json)
      const LOOP = ['GAIN','BRT','ZOOM','ROT','X','Y','HUE','SAT','BLUR','MIRR','DLAY','SEED','MZM','SFRQ','SKAL','PRST']
      const SW   = ['AtoB','BtoA','KEYA','KEYB','SEDA','SEDB','XFAD','PERI','SDLY','RVRS','FRZA','FRZB','GRID','----','----','VIEW']
      const MON  = []; for (let m = 1; m <= 4; m++) MON.push(`${m}HUE`, `${m}SAT`, `${m}BRT`, `${m}CON`)
      const GROUPS = { 1: LOOP, 2: LOOP, 3: SW, 4: MON }

      const loopControls = (g) => ({
        gain:   midi.cc([g, 1],  { min: 0.5, max: 2.5, init: 1.02, curve: 'log', steps: 200, fine: 10 }),
        bright: midi.cc([g, 2],  { min: -0.3, max: 0.3, init: 0, steps: 200, fine: 10 }),
        zoom:   midi.cc([g, 3],  { min: 0.8, max: 1.25, init: 1.02, curve: 'log', steps: 200, fine: 10 }),
        rot:    midi.cc([g, 4],  { min: 0, max: 6.283, init: 0.02, wrap: true, steps: 360, fine: 10 }),
        x:      midi.cc([g, 5],  { min: -0.2, max: 0.2, init: 0, steps: 200, fine: 10 }),
        y:      midi.cc([g, 6],  { min: -0.2, max: 0.2, init: 0, steps: 200, fine: 10 }),
        hue:    midi.cc([g, 7],  { min: -0.1, max: 0.1, init: 0.005, steps: 200, fine: 10 }),
        sat:    midi.cc([g, 8],  { min: 0.5, max: 1.5, init: 1.0, steps: 100, fine: 10 }),
        blur:   midi.cc([g, 9],  { min: 0.0005, max: 0.02, init: 0.003, curve: 'log', steps: 100, fine: 10 }),
        mirror: midi.cc([g, 10], { min: 0, max: 1, init: 0.35, steps: 100, fine: 10 }),
        delay:  midi.cc([g, 11], { min: 1, max: 29, init: 1, steps: 28 }),
        seed:   midi.cc([g, 12], { min: 0, max: 1, init: 0.08, steps: 100, fine: 10 }),
        mzm:    midi.cc([g, 13], { min: 0.5, max: 2, init: 0.9, curve: 'log', steps: 100, fine: 10 }),
        sfrq:   midi.cc([g, 14], { min: 1, max: 60, init: 8, curve: 'log', steps: 100 }),
        skal:   midi.cc([g, 15], { min: 0, max: 12, init: 3, steps: 12 }),
        persist: midi.cc([g, 16], { min: 0, max: 1, init: 0, steps: 100 })
      })
      const A = loopControls(1)
      const B = loopControls(2)
      const S = {
        atob: midi.cc([3, 1],  { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        btoa: midi.cc([3, 2],  { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        keya: midi.cc([3, 3],  { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        keyb: midi.cc([3, 4],  { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        seda: midi.cc([3, 5],  { min: 0, max: 1, init: 1, steps: 100 }),   // seed level multiplier per loop
        sedb: midi.cc([3, 6],  { min: 0, max: 1, init: 1, steps: 100 }),
        xfad: midi.cc([3, 7],  { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        peri: midi.cc([3, 8],  { min: 0, max: 8, init: 0, steps: 64 }),   // seconds, 0 = off
        sdly: midi.cc([3, 9],  { min: 1, max: 29, init: 1, steps: 28 }),
        rvrs: midi.cc([3, 10], { min: 0, max: 1, init: 0, steps: 1 }),
        frza: midi.cc([3, 11], { min: 0, max: 1, init: 0, steps: 1 }),
        frzb: midi.cc([3, 12], { min: 0, max: 1, init: 0, steps: 1 }),
        grid: midi.cc([3, 13], { min: 0, max: 1, init: 0, steps: 1 })
      }
      const mon = (m) => ({
        hue: midi.cc([4, (m - 1) * 4 + 1], { min: -0.5, max: 0.5, init: 0, steps: 100, fine: 10 }),
        sat: midi.cc([4, (m - 1) * 4 + 2], { min: 0, max: 2, init: 1, steps: 100, fine: 10 }),
        brt: midi.cc([4, (m - 1) * 4 + 3], { min: -0.5, max: 0.5, init: 0, steps: 100, fine: 10 }),
        con: midi.cc([4, (m - 1) * 4 + 4], { min: 0.5, max: 2, init: 1, curve: 'log', steps: 100, fine: 10 })
      })
      const M = [null, mon(1), mon(2), mon(3), mon(4)]   // 1 = A direct, 2 = A mirror, 3 = B direct, 4 = B mirror
      const P = { A, B, S, M }

      o0.setDepth(30); o1.setDepth(30); o2.setDepth(30)

      // ---- the seed (what the switcher's external input shows)
      const seedSel = document.getElementById('seed')
      const urlBox = document.getElementById('url')
      let seedKind = q.get('seed') || 'osc'
      let seedUrl = q.get('url') || ''
      seedSel.value = seedKind; urlBox.value = seedUrl
      let s0kind = null
      const ensureSource = (kind) => {
        if (kind === 'cam' && s0kind !== 'cam') { s0.initCam(); s0kind = 'cam' }
        if (kind === 'screen' && s0kind !== 'screen') { s0.initScreen(); s0kind = 'screen' }
        if (kind === 'video' && s0kind !== 'video:' + seedUrl) { if (seedUrl) { s0.initVideo(seedUrl); s0kind = 'video:' + seedUrl } }
        if (kind === 'image' && s0kind !== 'image:' + seedUrl) { if (seedUrl) { s0.initImage(seedUrl); s0kind = 'image:' + seedUrl } }
      }
      // the seed sketch uses loop A's SFRQ/SKAL knobs (one seed, two loops)
      const kalOn = () => Math.round(A.skal()) >= 2
      const kal = (chain) => kalOn() ? chain.kaleid(() => Math.max(2, Math.round(A.skal()))) : chain
      // ---- user code: a seed expression, or roughshod
      const editor = document.getElementById('editor'), codeBox = document.getElementById('code'), everr = document.getElementById('everr')
      try { const saved = localStorage.getItem('herder.code'); if (saved) codeBox.value = saved } catch (e) { /* no storage */ }
      const editMode = () => document.querySelector('input[name=emode]:checked').value
      const evalSeed = () => {
        // seed mode: a chain; a trailing .out(...) is a habit, so strip it (the page outputs to o2)
        const text = codeBox.value.trim().replace(/\.out\s*\([^)]*\)\s*;?\s*$/, '')
        const chain = (0, eval)(text)
        if (!chain || typeof chain.out !== 'function') throw new Error('seed code must be a chain, e.g. osc(10).kaleid(4)')
        return chain
      }
      const seedChain = () => {
        switch (seedKind) {
          case 'sketch': {
            try { everr.textContent = ''; return kal(evalSeed()) } catch (e) { everr.textContent = e.message; return kal(osc(A.sfrq, 0.05, 1)) }
          }
          case 'noise': return kal(noise(A.sfrq, 0.1).brightness(0.4).contrast(1.6))
          case 'voronoi': return kal(voronoi(A.sfrq, 0.3, 0.3))
          case 'cam': case 'screen': case 'video': case 'image': ensureSource(seedKind); return kal(src(s0))
          default: return kal(osc(A.sfrq, 0.05, 1))
        }
      }
      // the seed as seen by the loops: o2, delayed by SDLY frames
      const seedTex = () => o2.delay(() => Math.round(S.sdly()))

      // ---- one loop: own output, own controls, the other loop's output for the cross-link
      const monitor = (chain, m) => chain.hue(M[m].hue).saturate(M[m].sat).brightness(M[m].brt).contrast(M[m].con)
      const loop = (self, other, L, monDirect, monMirror, link, key, seedLevel) => {
        const camera = blur(self.delay(() => Math.round(L.delay())), L.blur)
        const direct = monitor(camera, monDirect).scale(L.zoom).rotate(L.rot).scroll(L.x, L.y)
        const reflected = monitor(src(self).scale(L.mzm, -1, 1), monMirror)
        let chain = direct
          .blend(reflected, L.mirror)                          // beam splitter
          .blend(src(other), link)                             // cross-link from the other loop
          .hue(L.hue).saturate(L.sat).contrast(L.gain).brightness(L.bright)
          .blend(src(self.delay(15)), L.persist)
        const amount = () => L.seed() * seedLevel()
        if (key() > 0.005) {
          // keyed: the seed replaces pixels only where its luminance passes the key (issue 71 in lightherder)
          chain = chain.layer(src(seedTex()).luma(key, 0.1).mult(solid(1, 1, 1, amount), 1))
        } else {
          chain = chain.blend(src(seedTex()), amount)          // crossfaded
        }
        return chain
      }

      // ---- build everything (called again when a chain's shape changes: seed kind, kaleid, key, freeze)
      let built = {}
      const shape = () => JSON.stringify({ seedKind, kal: kalOn(), keya: S.keya() > 0.005, keyb: S.keyb() > 0.005, fa: S.frza() > 0.5, fb: S.frzb() > 0.5, rv: S.rvrs() > 0.5 })
      const build = () => {
        seedChain().out(o2)
        const swap = S.rvrs() > 0.5
        const [oa, ob] = swap ? [o1, o0] : [o0, o1]
        if (S.frza() > 0.5) src(o0.delay(1)).out(o0); else loop(oa, ob, A, 1, 2, S.btoa, S.keya, S.seda).out(o0)
        if (S.frzb() > 0.5) src(o1.delay(1)).out(o1); else loop(ob, oa, B, 3, 4, S.atob, S.keyb, S.sedb).out(o1)
        // program: A crossfaded with B; PERI > 0 flips the crossfade every PERI seconds
        const xf = () => { const p = S.peri(); const x = S.xfad(); if (p <= 0.05) return x; return (Math.floor(time / p) % 2) ? 1 - x : x }
        src(o0).blend(src(o1), xf).out(o3)
        built = shape()
      }
      const setSeed = (kind, url) => {
        seedKind = kind; if (url !== undefined) seedUrl = url
        seedSel.value = kind
        urlBox.style.display = (kind === 'video' || kind === 'image') ? '' : 'none'
        build()
      }
      seedSel.onchange = () => setSeed(seedSel.value)
      urlBox.onchange = () => setSeed(seedKind, urlBox.value)
      const seedOrder = ['osc', 'noise', 'voronoi', 'cam', 'screen', 'sketch']

      // ---- views
      let view = 'program'
      const views = { program: () => render(o3), a: () => render(o0), b: () => render(o1), seed: () => render(o2), grid: () => render() }
      const setView = (v) => { view = v; views[v]() }
      const viewPush = midi.note([3, 16], { toggle: true })
      let lastViewPush = viewPush(), lastGrid = S.grid() > 0.5
      setSeed(seedKind)
      setView('program')

      const applyCode = () => {
        try { localStorage.setItem('herder.code', codeBox.value) } catch (e) { /* no storage */ }
        everr.textContent = ''
        if (editMode() === 'seed') { setSeed('sketch') }
        else {
          try { (0, eval)(codeBox.value) } catch (e) { everr.textContent = e.message }   // roughshod: whatever it does, it does
        }
      }
      document.getElementById('apply').onclick = applyCode
      codeBox.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); applyCode() }
        if (e.key === 'Escape') { editor.style.display = 'none'; codeBox.blur() }
        e.stopPropagation()
      })

      // ---- HUD: header + one group's 4x4 block; [ and ] change the group shown
      const DESC = {
        GAIN: 'Loop gain: contrast on the camera path. Fractals live just above 1. Push for fine.',
        BRT: 'Brightness offset on the camera path, the other half of loop gain.',
        ZOOM: 'Camera distance per pass: above 1 zooms in (tunnel), below 1 recedes.',
        ROT: 'Camera rotation per pass in radians, wraps. With zoom this makes spirals.',
        X: 'Camera offset per pass, sideways.', Y: 'Camera offset per pass, up and down.',
        HUE: 'Hue drift per pass.', SAT: 'Saturation multiplier per pass.',
        BLUR: 'Optical softening radius (fraction of width). Too little crystallizes, too much loses detail.',
        MIRR: 'Beam splitter reflectance: how much of the mirrored monitor the camera sees.',
        DLAY: 'Camera delay in frames (1 to 29). Higher lags and breathes; move slowly.',
        SEED: 'How much of the seed enters this loop (times SEDA/SEDB on GR03).',
        MZM: 'Mirror zoom: optical distance of the reflected monitor.',
        SFRQ: 'Seed frequency or scale (loop A knob drives the shared seed).', SKAL: 'Seed kaleidoscope sides; below 2 = off (loop A knob).',
        PRST: 'Persistence: an extra echo from 15 frames back.',
        AtoB: 'Cross-link: how much of loop A the camera of loop B sees.', BtoA: 'Cross-link: how much of loop B the camera of loop A sees.',
        KEYA: 'Luma key threshold for the seed entering A. Above 0 the seed is keyed per pixel instead of crossfaded.',
        KEYB: 'Luma key threshold for the seed entering B.',
        SEDA: 'Seed level multiplier for loop A (with SEED on GR01).', SEDB: 'Seed level multiplier for loop B (with SEED on GR02).',
        XFAD: 'Program crossfade: 0 shows loop A, 1 shows loop B.', PERI: 'Period in seconds for rhythmic reversal of the crossfade; 0 = off.',
        SDLY: 'Seed delay in frames before it enters the loops.', RVRS: 'Reverse: swap which output each loop reads as itself.',
        FRZA: 'Freeze loop A (holds the last frame).', FRZB: 'Freeze loop B.', GRID: 'Show all four outputs.', '----': 'unassigned', VIEW: 'push: toggle grid'
      }
      for (let m = 1; m <= 4; m++) { const who = ['A direct', 'A mirror', 'B direct', 'B mirror'][m - 1]; DESC[`${m}HUE`] = `Monitor ${m} (${who}) hue.`; DESC[`${m}SAT`] = `Monitor ${m} (${who}) saturation.`; DESC[`${m}BRT`] = `Monitor ${m} (${who}) brightness.`; DESC[`${m}CON`] = `Monitor ${m} (${who}) contrast.` }
      // ---- the virtual surface: all four groups as draggable numbers (drag, wheel, click = push, shift = fine)
      const head = document.getElementById('headtext')
      const panel = mountPanel(document.getElementById('panel'), midi, {
        groups: [
          { group: 1, title: 'LOPA loop A', labels: LOOP, descs: DESC },
          { group: 2, title: 'LOPB loop B', labels: LOOP, descs: DESC },
          { group: 3, title: 'SWCH switchers', labels: SW, descs: DESC },
          { group: 4, title: 'MONS monitors', labels: MON, descs: DESC }
        ]
      })
      const refreshHud = () => {
        head.textContent = `${mode}  view ${view}   keys: 0 grid 1 A 2 B 3 seed 4 program  s seed  e edit  b rebuild  r reset  d dump  h hide   in: ${midi.inputs.filter(n => /faderfox|ec4/i.test(n)).join(', ') || '(no EC4)'}`
      }
      setInterval(() => {
        if (viewPush() !== lastViewPush) { lastViewPush = viewPush(); setView(view === 'grid' ? 'program' : 'grid') }
        const g = S.grid() > 0.5; if (g !== lastGrid) { lastGrid = g; setView(g ? 'grid' : 'program') }
        if (shape() !== built) build()
        if (q.get('h')) { hud.style.display = 'none'; return }
        refreshHud()
      }, 200)
      document.addEventListener('keydown', (e) => {
        if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return   // typing, not flying
        if (e.key === 'e') { editor.style.display = editor.style.display === 'none' || !editor.style.display ? 'block' : 'none'; if (editor.style.display === 'block') codeBox.focus() }
        if (e.key === 'b') build()
        if (e.key === 'h') hud.style.display = hud.style.display === 'none' ? '' : 'none'
        if (e.key === '0') setView('grid'); if (e.key === '1') setView('a'); if (e.key === '2') setView('b'); if (e.key === '3') setView('seed'); if (e.key === '4') setView('program')
        if (e.key === 'r') { for (const o of [A, B, S, M[1], M[2], M[3], M[4]]) Object.values(o).forEach(f => f.reset()); midi.refresh() }
        if (e.key === 's') setSeed(seedOrder[(seedOrder.indexOf(seedKind) + 1) % seedOrder.length])
      })
      // ---- state dump: 'd' logs everything as JSON (and copies it to the clipboard)
      const dump = () => {
        const groupOf = (obj, labels) => Object.fromEntries(Object.values(obj).map((f, i) => [labels[i], +f().toFixed(5)]))
        const state = {
          when: new Date().toISOString(),
          page: 'herder', mode, time: +time.toFixed(3),
          seed: { kind: seedKind, url: seedUrl || null }, view,
          ring: { o0: o0.depth, o1: o1.depth, o2: o2.depth },
          midi: { inputs: midi.inputs, outputs: midi.outputs, profile: midi.profile && midi.profile.name, mode: midi.state.defaults.mode },
          groups: {
            LOPA: groupOf(A, LOOP), LOPB: groupOf(B, LOOP), SWCH: groupOf(S, SW),
            MONS: Object.fromEntries([1, 2, 3, 4].flatMap(m => [['hue', M[m].hue], ['sat', M[m].sat], ['brt', M[m].brt], ['con', M[m].con]].map(([k, f]) => [`${m}${k.toUpperCase()}`, +f().toFixed(5)])))
          },
          snapshot: midi.snapshot()   // raw "channel:cc" -> value, what midi.restore() takes
        }
        const text = JSON.stringify(state, null, 2)
        console.log('[herder] state dump\n' + text)
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { head.textContent = 'state dumped to console and clipboard' }).catch(() => {})
        return state
      }
      document.addEventListener('keydown', (e) => { if (e.key === 'd') dump() })
      window.__herder = { P, midi, panel, setSeed, setView, build, dump, applyCode, codeBox, get seedKind () { return seedKind }, get view () { return view } }
    </script>
  </body>
</html>
