<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Herder, two loops</title>
    <style>
      body { margin: 0; background: black; color: #ccc; font-family: monospace; font-size: 12px; overflow: hidden; }
      canvas { width: 100vw; height: 100vh; display: block; object-fit: contain; background: black; }
      #hud { position: fixed; left: 8px; bottom: 8px; font-size: 11px; }
      #hudhead { background: rgba(0,0,0,0.55); padding: 3px 6px; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
      #headtext { white-space: pre-wrap; }
      #hudhead select, #hudhead input, #editor textarea, #editor button, #editor label { font: inherit; background: #111; color: #ddd; border: 1px solid #444; }
      #editor { display: none; background: rgba(0,0,0,0.7); padding: 6px 8px; margin-bottom: 4px; }
      #editor textarea { width: 60em; height: 7em; display: block; margin: 4px 0; }
      #editor .err { color: #f88; }
      #editor label { border: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="hudhead">
        <span id="seedbox">seed <select id="seed">
          <option value="osc">osc + kaleid</option>
          <option value="noise">noise</option>
          <option value="voronoi">voronoi</option>
          <option value="cam">camera</option>
          <option value="screen">screen</option>
          <option value="video">video url</option>
          <option value="image">image url</option>
          <option value="sketch">sketch (e to edit)</option>
        </select> <input id="url" placeholder="url" size="24" style="display:none" /></span>
        <a href="manual.html" target="_blank" style="color:#9cf">manual</a>
        <span id="headtext">loading</span>
      </div>
      <div id="editor">
        <div>Hydra code. <label><input type="radio" name="emode" value="seed" checked /> seed: a chain (no out() needed) that becomes the seed on o2, loops untouched</label>
        <label><input type="radio" name="emode" value="raw" /> roughshod: run as-is, anything goes (b rebuilds the loops)</label>
        <span style="float:right">ctrl+enter apply, esc close</span></div>
        <textarea id="code" spellcheck="false">osc(12, 0.05, 1).kaleid(5).rotate(() => time * 0.1)</textarea>
        <button id="apply">apply</button> <span id="everr" class="err"></span>
      </div>
      <div id="panel"></div>
    </div>
    <script type="module">
      // Two Light Herder loops on the EC4.
      //   o0 loop A (GR01)   o1 loop B (GR02)   o2 the seed   o3 program = A crossfaded with B (GR03 XFAD)
      //   GR03 switcher panel: cross-links, luma keys, crossfade, period, seed delay, freezes, grid
      //   GR04 monitors: hue/sat/brightness/contrast of the four monitors (A direct, A mirror, B direct, B mirror)
      // Query: mode = gl | gpu, seed = osc|noise|voronoi|cam|screen|video|image, url = for video/image, h = hide hud,
      //   res = WxH (the loops' resolution for the run; default the display's device pixels), panel = window
      //   float = 0 for 8-bit outputs (default half-float: the loops keep headroom and fine steps between frames)
      const q = new URLSearchParams(location.search)
      const mode = q.get('mode') || 'gpu'
      const canvas = document.getElementById('c')
      const hud = document.getElementById('hud')
      // The resolution is fixed for the run, as on a real rig: the window shows it letterboxed and a
      // resize rescales the view instead of emptying the frame ring. Default: the display's device
      // pixels (3840x2160 on a 4K screen at Retina scaling); ?res=1920x1080 for a weaker machine.
      const dpr = window.devicePixelRatio || 1
      const resq = /^(\d+)x(\d+)$/.exec(q.get('res') || '')
      const W = Math.min(7680, resq ? +resq[1] : Math.round(window.innerWidth * dpr))
      const H = Math.min(4320, resq ? +resq[2] : Math.round(window.innerHeight * dpr))
      canvas.width = W; canvas.height = H

      const { createHydra } = await import('../extensions/vertex/index-webgpu.js')
      const { install, ec4 } = await import('../extensions/midi/index.js')
      const { mountPanel } = await import('../extensions/midi/ui/panel.js')
      const hydra = await createHydra({ canvas, width: W, height: H, detectAudio: false, makeGlobal: true, numOutputs: 4, filter: 'linear', float: q.get('float') !== '0', useWGSL: mode === 'gpu' })
      window.__hydra = hydra
      if (hydra._vertexResizeObserver) { hydra._vertexResizeObserver.disconnect(); delete hydra._vertexResizeObserver }   // the window may change; the loops do not
      // frames per second, from the page's own animation frames
      let fps = 0; { let n = 0, t0 = performance.now(); const count = (t) => { n++; if (t - t0 >= 1000) { fps = Math.round(n * 1000 / (t - t0)); n = 0; t0 = t } requestAnimationFrame(count) }; requestAnimationFrame(count) }
      const midi = await install(hydra, { profile: ec4 })

      // ---- controls, as labelled on the device (dev/herder-ec4-labels.json)
      // Groups by what a knob belongs to (camera, switcher, monitor, seed, rig), after Rust's split;
      // PLAY is a view: aliases of the knobs a set rides, one value in two places (midi.alias).
      // Label case says what the finger does: UPPER = a knob you turn (push = fine where it has it),
      // Capitalised = a switch you turn, lowercase = a push-only button. Same on the EC4's OLED.
      const pad = (a) => a.concat(Array(16 - a.length).fill('----'))
      const CAM  = pad(['GAIN','ZOOM','ROT','X','Y','BLUR','DLAY','PRST','PTCH','YAW','LENS','PDLY']); CAM[15] = 'home'
      const SW   = pad(['XFAD','PERI','Rvrs','Frza','Frzb','Grid','Void']); SW[15] = 'view'
      const MON  = []; for (let m = 1; m <= 4; m++) MON.push(`${m}HUE`, `${m}SAT`, `${m}BRT`, `${m}CON`)
      const SEED = pad(['LEVA','LEVB','SFRQ','SKAL','SDLY','Kind'])
      const RIG  = pad(['MIRA','MZMA','MIRB','MZMB','AtoB','BtoA','KEYA','KEYB'])
      const PLAY = pad(['GNA','ZMA','RTA','LVA','GNB','ZMB','RTB','LVB','XFAD','PERI','SDLY','Void','SKAL'])
      const GROUPS = { 1: CAM, 2: CAM, 3: SW, 4: MON, 5: SEED, 6: RIG, 7: PLAY }

      const camControls = (g) => ({   // key order = CAM label order (the dump relies on it)
        gain:   midi.cc([g, 1], { min: 0.8, max: 1.25, init: 1, curve: 'log', steps: 200, fine: 10 }),
        zoom:   midi.cc([g, 2], { min: 0.5, max: 2, init: 1.02, curve: 'log', steps: 300, fine: 10 }),   // unity mid-travel, ~0.5% a detent (Rust's step)
        rot:    midi.cc([g, 3], { min: 0, max: 6.283, init: 0.02, wrap: true, steps: 360, fine: 10 }),
        x:      midi.cc([g, 4], { min: -0.2, max: 0.2, init: 0, steps: 200, fine: 10 }),
        y:      midi.cc([g, 5], { min: -0.2, max: 0.2, init: 0, steps: 200, fine: 10 }),
        blur:   midi.cc([g, 6], { min: 0, max: 0.02, init: 0, curve: 'exp', steps: 100, fine: 10 }),   // 0 = sharp lens (bilinear sampling still softens a fraction of a texel)
        delay:  midi.cc([g, 7], { min: 1, max: 29, init: 1, steps: 28 }),
        persist: midi.cc([g, 8], { min: 0, max: 1, init: 0, steps: 100 }),
        pitch:  midi.cc([g, 9], { min: -0.7, max: 0.7, init: 0, steps: 200, fine: 10 }),
        yaw:    midi.cc([g, 10], { min: -0.7, max: 0.7, init: 0, steps: 200, fine: 10 }),
        lens:   midi.cc([g, 11], { min: 1, max: 6, init: 2.5, curve: 'log', steps: 100, fine: 10 }),
        pdly:   midi.cc([g, 12], { min: 1, max: 29, init: 15, steps: 28 })
      })
      const A = camControls(1)
      const B = camControls(2)
      // HOME (push on encoder 16): the camera square on the monitor again. Pose only; gain, blur,
      // delay and lens are the loop's character, not where the camera points.
      const POSE = ['zoom', 'rot', 'x', 'y', 'pitch', 'yaw']
      const home = (L) => { for (const k of POSE) L[k].reset(); midi.refresh() }
      const homePush = [midi.note([1, 16], { toggle: true }), midi.note([2, 16], { toggle: true })]
      const lastHome = homePush.map(f => f())
      const S = {   // switchers: what is played
        xfad: midi.cc([3, 1], { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        peri: midi.cc([3, 2], { min: 0, max: 8, init: 0, steps: 64 }),   // seconds, 0 = off
        rvrs: midi.cc([3, 3], { min: 0, max: 1, init: 0, steps: 1 }),
        frza: midi.cc([3, 4], { min: 0, max: 1, init: 0, steps: 1 }),
        frzb: midi.cc([3, 5], { min: 0, max: 1, init: 0, steps: 1 }),
        grid: midi.cc([3, 6], { min: 0, max: 1, init: 0, steps: 1 }),
        void: midi.cc([3, 7], { min: 0, max: 1, init: 1, steps: 1 })    // black beyond the monitor (srcb/blurb) or wrap (src/blur)
      }
      const SD = {  // the seed: one light coming in, two doors
        leva: midi.cc([5, 1], { min: 0, max: 1, init: 0.08, steps: 100, fine: 10 }),
        levb: midi.cc([5, 2], { min: 0, max: 1, init: 0.08, steps: 100, fine: 10 }),
        sfrq: midi.cc([5, 3], { min: 1, max: 60, init: 8, curve: 'log', steps: 100 }),
        skal: midi.cc([5, 4], { min: 0, max: 12, init: 0, steps: 12 }),   // 0 = the seed as itself
        sdly: midi.cc([5, 5], { min: 1, max: 29, init: 1, steps: 28 }),
        kind: midi.cc([5, 6], { min: 0, max: 5, init: 0, steps: 5 })    // osc noise voronoi cam screen sketch
      }
      const R = {   // the rig: glass and cabling, set per piece
        mira: midi.cc([6, 1], { min: 0, max: 1, init: 0.35, steps: 100, fine: 10 }),
        mzma: midi.cc([6, 2], { min: 0.5, max: 2, init: 0.9, curve: 'log', steps: 100, fine: 10 }),
        mirb: midi.cc([6, 3], { min: 0, max: 1, init: 0.35, steps: 100, fine: 10 }),
        mzmb: midi.cc([6, 4], { min: 0.5, max: 2, init: 0.9, curve: 'log', steps: 100, fine: 10 }),
        atob: midi.cc([6, 5], { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        btoa: midi.cc([6, 6], { min: 0, max: 1, init: 0, steps: 100, fine: 10 }),
        keya: midi.cc([6, 7], { min: 0, max: 1, init: 0.35, steps: 100, fine: 10 }),
        keyb: midi.cc([6, 8], { min: 0, max: 1, init: 0.35, steps: 100, fine: 10 })
      }
      // PLAY: the knobs a set rides, aliased from their homes (turn either, both displays follow)
      const playOf = [[1, 1], [1, 2], [1, 3], [5, 1], [2, 1], [2, 2], [2, 3], [5, 2], [3, 1], [3, 2], [5, 5], [3, 7], [5, 4]]
      playOf.forEach((home, i) => midi.alias([7, i + 1], home))
      const mon = (m) => ({
        hue: midi.cc([4, (m - 1) * 4 + 1], { min: -0.5, max: 0.5, init: 0, steps: 100, fine: 10 }),
        sat: midi.cc([4, (m - 1) * 4 + 2], { min: 0, max: 2, init: 1, steps: 100, fine: 10 }),
        brt: midi.cc([4, (m - 1) * 4 + 3], { min: -0.5, max: 0.5, init: 0, steps: 100, fine: 10 }),
        con: midi.cc([4, (m - 1) * 4 + 4], { min: 0.5, max: 2, init: 1, curve: 'log', steps: 100, fine: 10 })
      })
      const M = [null, mon(1), mon(2), mon(3), mon(4)]   // 1 = A direct, 2 = A mirror, 3 = B direct, 4 = B mirror
      const P = { A, B, S, M, SD, R }

      o0.setDepth(30); o1.setDepth(30); o2.setDepth(30)

      // ---- the seed (what the switcher's external input shows)
      const seedSel = document.getElementById('seed')
      const urlBox = document.getElementById('url')
      let seedKind = q.get('seed') || 'osc'
      let seedUrl = q.get('url') || ''
      seedSel.value = seedKind; urlBox.value = seedUrl
      let s0kind = null
      const ensureSource = (kind) => {
        if (kind === 'cam' && s0kind !== 'cam') { s0.initCam(); s0kind = 'cam' }
        if (kind === 'screen' && s0kind !== 'screen') { s0.initScreen(); s0kind = 'screen' }
        if (kind === 'video' && s0kind !== 'video:' + seedUrl) { if (seedUrl) { s0.initVideo(seedUrl); s0kind = 'video:' + seedUrl } }
        if (kind === 'image' && s0kind !== 'image:' + seedUrl) { if (seedUrl) { s0.initImage(seedUrl); s0kind = 'image:' + seedUrl } }
      }
      const kalOn = () => Math.round(SD.skal()) >= 2
      const kal = (chain) => kalOn() ? chain.kaleid(() => Math.max(2, Math.round(SD.skal()))) : chain
      // ---- user code: a seed expression, or roughshod
      const editor = document.getElementById('editor'), codeBox = document.getElementById('code'), everr = document.getElementById('everr')
      try { const saved = localStorage.getItem('herder.code'); if (saved) codeBox.value = saved } catch (e) { /* no storage */ }
      const editMode = () => document.querySelector('input[name=emode]:checked').value
      const evalSeed = () => {
        // seed mode: a chain; a trailing .out(...) is a habit, so strip it (the page outputs to o2)
        const text = codeBox.value.trim().replace(/\.out\s*\([^)]*\)\s*;?\s*$/, '')
        const chain = (0, eval)(text)
        if (!chain || typeof chain.out !== 'function') throw new Error('seed code must be a chain, e.g. osc(10).kaleid(4)')
        return chain
      }
      const seedChain = () => {
        switch (seedKind) {
          case 'sketch': {
            try { everr.textContent = ''; return kal(evalSeed()) } catch (e) { everr.textContent = e.message; return kal(osc(SD.sfrq, 0.05, 1)) }
          }
          case 'noise': return kal(noise(SD.sfrq, 0.1).brightness(0.4).contrast(1.6))
          case 'voronoi': return kal(voronoi(SD.sfrq, 0.3, 0.3))
          case 'cam': case 'screen': case 'video': case 'image': ensureSource(seedKind); return kal(src(s0))
          default: return kal(osc(SD.sfrq, 0.05, 1))
        }
      }
      // the seed as seen by the loops: o2, delayed by SDLY frames
      const seedTex = () => o2.delay(() => Math.round(SD.sdly()))

      // ---- one loop: own output, own controls, the other loop's output for the cross-link
      const monitor = (chain, m) => chain.hue(M[m].hue).saturate(M[m].sat).brightness(M[m].brt).contrast(M[m].con)
      const loop = (self, other, L, monDirect, monMirror, glass, link, key, amount) => {
        const dark = S.void() > 0.5                              // a camera sees an unlit room past the monitor
        const seen = () => self.delay(() => Math.round(L.delay()))
        const lens = () => L.blur() > 0 ? (dark ? blurb : blur)(seen(), L.blur) : (dark ? srcb : src)(seen())   // focus at 0 = the sampler alone
        // one camera, one pose: it turns and slides as a whole, so the monitor in the glass moves with the one seen direct
        const pose = (chain) => chain.scale(L.zoom).offset(L.x, L.y).tilt(L.pitch, L.yaw, L.lens).rotate(L.rot)
        const direct = pose(monitor(lens(), monDirect))
        const reflected = pose(monitor(lens().scale(glass.mzm, -1, 1), monMirror))
        let chain = direct
          .blend(reflected, glass.mirror)                      // beam splitter: the two halves sum to one
          .blend(src(other), link)                             // cross-link from the other loop
          .color(L.gain, L.gain, L.gain)                       // loop gain: exposure, a gain about black (contrast pivots on mid-grey and crushes the echoes)
          .knee(2)                                             // the rails: past white the signal bends onto 2 instead of running (float outputs keep the reserve)
          .blend(src(self.delay(() => Math.round(L.pdly()))), L.persist)   // PRST at PDLY frames back
        if (key() > 0.005) {
          // keyed: the seed replaces pixels only where its luminance passes the key (issue 71 in lightherder)
          chain = chain.layer(src(seedTex()).luma(key, 0.1).mult(solid(1, 1, 1, amount), 1))
        } else {
          chain = chain.blend(src(seedTex()), amount)          // crossfaded
        }
        return chain
      }

      // ---- build everything (called again when a chain's shape changes: seed kind, kaleid, key, freeze)
      let built = {}
      const shape = () => JSON.stringify({ seedKind, kal: kalOn(), bla: A.blur() > 0, blb: B.blur() > 0, keya: R.keya() > 0.005, keyb: R.keyb() > 0.005, fa: S.frza() > 0.5, fb: S.frzb() > 0.5, rv: S.rvrs() > 0.5, vd: S.void() > 0.5 })
      const build = () => {
        seedChain().out(o2)
        const swap = S.rvrs() > 0.5
        const [oa, ob] = swap ? [o1, o0] : [o0, o1]
        if (S.frza() > 0.5) src(o0.delay(1)).out(o0); else loop(oa, ob, A, 1, 2, { mirror: R.mira, mzm: R.mzma }, R.btoa, R.keya, SD.leva).out(o0)
        if (S.frzb() > 0.5) src(o1.delay(1)).out(o1); else loop(ob, oa, B, 3, 4, { mirror: R.mirb, mzm: R.mzmb }, R.atob, R.keyb, SD.levb).out(o1)
        // program: A crossfaded with B; PERI > 0 flips the crossfade every PERI seconds
        const xf = () => { const p = S.peri(); const x = S.xfad(); if (p <= 0.05) return x; return (Math.floor(time / p) % 2) ? 1 - x : x }
        src(o0).blend(src(o1), xf).out(o3)
        built = shape()
      }
      let lastKindKnob = Math.round(SD.kind())
      const setSeed = (kind, url) => {
        seedKind = kind; if (url !== undefined) seedUrl = url
        seedSel.value = kind
        const i = seedOrder.indexOf(kind); if (i >= 0 && Math.round(SD.kind()) !== i) { SD.kind.set(i); lastKindKnob = i }
        urlBox.style.display = (kind === 'video' || kind === 'image') ? '' : 'none'
        build()
      }
      seedSel.onchange = () => setSeed(seedSel.value)
      urlBox.onchange = () => setSeed(seedKind, urlBox.value)
      const seedOrder = ['osc', 'noise', 'voronoi', 'cam', 'screen', 'sketch']

      // ---- views
      let view = 'program'
      const views = { program: () => render(o3), a: () => render(o0), b: () => render(o1), seed: () => render(o2), grid: () => render() }
      const setView = (v) => { view = v; views[v]() }
      const viewPush = midi.note([3, 16], { toggle: true })
      let lastViewPush = viewPush(), lastGrid = S.grid() > 0.5
      setSeed(seedKind)
      setView('program')

      const applyCode = () => {
        try { localStorage.setItem('herder.code', codeBox.value) } catch (e) { /* no storage */ }
        everr.textContent = ''
        if (editMode() === 'seed') { setSeed('sketch') }
        else {
          try { (0, eval)(codeBox.value) } catch (e) { everr.textContent = e.message }   // roughshod: whatever it does, it does
        }
      }
      document.getElementById('apply').onclick = applyCode
      codeBox.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); applyCode() }
        if (e.key === 'Escape') { editor.style.display = 'none'; codeBox.blur() }
        e.stopPropagation()
      })

      // ---- HUD: header + one group's 4x4 block; [ and ] change the group shown
      const DESC = {
        GAIN: 'Loop gain: the camera\'s exposure, a gain about black. At 1 an echo comes back as bright as it left. Push for fine.',
        ZOOM: 'Magnification per pass (lens zoom, not a dolly): above 1 zooms in (tunnel), below 1 recedes into the void. 0.5 to 2, unity mid-travel.',
        ROT: 'Camera rotation per pass in radians, wraps. With zoom this makes spirals.',
        X: 'Camera off the monitor\'s axis, sideways.', Y: 'Camera off the monitor\'s axis, up and down.',
        BLUR: 'Lens focus: softening radius as a fraction of width. 0 = sharp, the blur is out of the path (sampling still softens a fraction of a texel).',
        DLAY: 'Camera delay in frames (1 to 29), a frame delay box after the camera. Higher lags and breathes.',
        PRST: 'Persistence: how much of the frame PDLY frames back is blended in (a comb filter; ours, not Blair\'s).',
        PDLY: 'Persistence delay in frames: 1 smears along the motion like a slow shutter, 15 echoes.',
        PTCH: 'Camera pitch: the monitor\'s top leans away (keystone). None of the rigs has this.', YAW: 'Camera yaw: the monitor\'s right edge leans away.',
        LENS: 'Lens: camera distance for the perspective, 1 very wide to 6 long. Sets how strong pitch and yaw keystone.',
        home: 'push: camera square on the monitor again (zoom, roll, x, y, pitch, yaw to their starting values). Gain, blur, delay and lens stay.',
        XFAD: 'Program crossfade: 0 shows loop A, 1 shows loop B.', PERI: 'Period in seconds for rhythmic reversal of the crossfade; 0 = off.',
        Rvrs: 'Reverse: swap which output each loop reads as itself.',
        Frza: 'Freeze loop A (holds the last frame).', Frzb: 'Freeze loop B.', Grid: 'Show all four outputs.',
        Void: 'Black beyond the monitor: the camera sees an unlit room past the screen, so a receding or turning loop walks into black. Off wraps like src() (tiles).',
        view: 'push: toggle grid',
        LEVA: 'How much of the seed enters loop A.', LEVB: 'How much of the seed enters loop B.',
        SFRQ: 'Seed frequency or scale.', SKAL: 'Seed kaleidoscope sides; below 2 = off.',
        SDLY: 'Seed delay in frames before it enters the loops.', Kind: 'Seed kind: 0 osc, 1 noise, 2 voronoi, 3 cam, 4 screen, 5 sketch.',
        MIRA: 'Loop A beam splitter: how much of the mirrored monitor camera A sees (fixed glass on Blair\'s rig).', MZMA: 'Loop A mirror zoom: optical distance of the reflected monitor.',
        MIRB: 'Loop B beam splitter reflectance.', MZMB: 'Loop B mirror zoom.',
        AtoB: 'Cross-link: how much of loop A the camera of loop B sees.', BtoA: 'Cross-link: how much of loop B the camera of loop A sees.',
        KEYA: 'Luma key threshold for the seed entering A. Above 0 the seed is keyed per pixel instead of crossfaded.',
        KEYB: 'Luma key threshold for the seed entering B.',
        GNA: 'Gain A (same knob as CAMA GAIN).', ZMA: 'Zoom A (CAMA ZOOM).', RTA: 'Rotation A (CAMA ROT).', LVA: 'Seed level A (SEED LEVA).',
        GNB: 'Gain B (CAMB GAIN).', ZMB: 'Zoom B (CAMB ZOOM).', RTB: 'Rotation B (CAMB ROT).', LVB: 'Seed level B (SEED LEVB).',
        '----': 'unassigned'
      }
      for (let m = 1; m <= 4; m++) { const who = ['A direct', 'A mirror', 'B direct', 'B mirror'][m - 1]; DESC[`${m}HUE`] = `Monitor ${m} (${who}) hue.`; DESC[`${m}SAT`] = `Monitor ${m} (${who}) saturation.`; DESC[`${m}BRT`] = `Monitor ${m} (${who}) brightness.`; DESC[`${m}CON`] = `Monitor ${m} (${who}) contrast.` }
      // ---- the virtual surface: all four groups as draggable numbers (drag, wheel, click = push, shift = fine)
      const head = document.getElementById('headtext')
      const panelGroups = [
          { group: 1, title: 'CAMA camera A', labels: CAM, descs: DESC },
          { group: 2, title: 'CAMB camera B', labels: CAM, descs: DESC },
          { group: 3, title: 'SWCH switchers', labels: SW, descs: DESC },
          { group: 4, title: 'MONS monitors', labels: MON, descs: DESC },
          { group: 5, title: 'SEED', labels: SEED, descs: DESC },
          { group: 6, title: 'RIG glass and links', labels: RIG, descs: DESC },
          { group: 7, title: 'PLAY (aliases)', labels: PLAY, descs: DESC }
      ]
      const panelHost = document.getElementById('panel')
      let panel = mountPanel(panelHost, midi, { groups: panelGroups })
      // ---- the controls in a window of their own ('p', or ?panel=window): the canvas stays clean for
      // a recording or a projector, the knobs live on the laptop screen. Same controller object, so
      // nothing is synced; the popup's keys are forwarded to this page. Closing it puts the panel back.
      let popup = null, popupHead = null
      const seedBox = document.getElementById('seedbox'), hudHead = document.getElementById('hudhead')
      const openPanelWindow = () => {
        if (popup && !popup.closed) { popup.focus(); return }
        popup = window.open('', 'herder-panel', 'width=1180,height=720')
        if (!popup) { head.textContent = 'popup blocked: allow popups for this page'; return }
        const d = popup.document
        d.title = 'Herder controls'
        d.body.style.cssText = 'margin: 8px; background: #111; color: #ccc; font-family: monospace;'
        d.body.innerHTML = ''
        // the header line goes with the controls, and the main window's HUD goes away: that is the point
        // the seed selector and the manual link move over with their handlers; the status is mirrored
        const bar = d.createElement('div'); bar.style.cssText = 'display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin-bottom: 6px; font-size: 12px;'
        bar.appendChild(d.adoptNode(seedBox))
        seedBox.querySelectorAll('select, input').forEach(el => { el.style.cssText = 'font: inherit; background: #111; color: #ddd; border: 1px solid #444;' })
        const link = d.createElement('a'); link.href = new URL('manual.html', location.href).href; link.target = '_blank'; link.textContent = 'manual'; link.style.color = '#9cf'
        bar.appendChild(link)
        popupHead = d.createElement('span'); popupHead.style.whiteSpace = 'pre-wrap'
        bar.appendChild(popupHead)
        d.body.appendChild(bar)
        panel.destroy(); panelHost.style.display = 'none'; hud.style.display = 'none'
        panel = mountPanel(d.body, midi, { groups: panelGroups })
        d.addEventListener('keydown', (e) => document.dispatchEvent(new KeyboardEvent('keydown', { key: e.key, ctrlKey: e.ctrlKey, metaKey: e.metaKey, shiftKey: e.shiftKey })))
        const back = () => {
          if (panelHost.style.display !== 'none') return
          hudHead.insertBefore(document.adoptNode(seedBox), hudHead.firstChild)
          panel.destroy(); panelHost.style.display = ''; hud.style.display = q.get('h') ? 'none' : ''; popupHead = null
          panel = mountPanel(panelHost, midi, { groups: panelGroups })
        }
        popup.addEventListener('pagehide', back)
      }
      const closePanelWindow = () => { if (popup && !popup.closed) popup.close(); popup = null }
      if (q.get('panel') === 'window') setTimeout(openPanelWindow, 0)
      let note = '', noteUntil = 0   // a message (saved, opened, ...) leads the header for a few seconds
      const refreshHud = () => {
        head.textContent = (performance.now() < noteUntil ? note + '   |   ' : '') + `${mode} ${W}x${H} ${fps} fps (display ${Math.round(screen.width * dpr)}x${Math.round(screen.height * dpr)} @${dpr}, window ${window.innerWidth}x${window.innerHeight})  view ${view}   keys: 0 grid 1 A 2 B 3 seed 4 program  s seed  e edit  b rebuild  r reset  d dump  w write patch  o open patch  h hide  p panel window   in: ${midi.inputs.filter(n => /faderfox|ec4/i.test(n)).join(', ') || '(no EC4)'}`
        if (popupHead) popupHead.textContent = head.textContent
      }
      setInterval(() => {
        if (viewPush() !== lastViewPush) { lastViewPush = viewPush(); setView(view === 'grid' ? 'program' : 'grid') }
        const g = S.grid() > 0.5; if (g !== lastGrid) { lastGrid = g; setView(g ? 'grid' : 'program') }
        const k = Math.round(SD.kind()); if (k !== lastKindKnob) { lastKindKnob = k; setSeed(seedOrder[k]) }
        homePush.forEach((f, i) => { if (f() !== lastHome[i]) { lastHome[i] = f(); home(i ? B : A) } })
        if (shape() !== built) build()
        if (q.get('h') && !popupHead) { hud.style.display = 'none'; return }
        refreshHud()
      }, 200)
      document.addEventListener('keydown', (e) => {
        if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return   // typing, not flying
        if (e.key === 'e') { editor.style.display = editor.style.display === 'none' || !editor.style.display ? 'block' : 'none'; if (editor.style.display === 'block') codeBox.focus() }
        if (e.key === 'b') build()
        if (e.key === 'h') hud.style.display = hud.style.display === 'none' ? '' : 'none'
        if (e.key === 'p') { if (popup && !popup.closed) closePanelWindow(); else openPanelWindow() }
        if (e.key === '0') setView('grid'); if (e.key === '1') setView('a'); if (e.key === '2') setView('b'); if (e.key === '3') setView('seed'); if (e.key === '4') setView('program')
        if (e.key === 'r') { for (const o of [A, B, S, SD, R, M[1], M[2], M[3], M[4]]) Object.values(o).forEach(f => f.reset()); midi.refresh() }
        if (e.key === 's') setSeed(seedOrder[(seedOrder.indexOf(seedKind) + 1) % seedOrder.length])
      })
      // ---- state: 'd' logs it as JSON (and copies it to the clipboard), 'w' writes it to a file, 'o' opens one
      const stateOf = () => {
        const groupOf = (obj, labels) => Object.fromEntries(Object.values(obj).map((f, i) => [labels[i], +f().toFixed(5)]))
        const state = {
          when: new Date().toISOString(),
          page: 'herder', mode, time: +time.toFixed(3),
          seed: { kind: seedKind, url: seedUrl || null }, view,
          ring: { o0: o0.depth, o1: o1.depth, o2: o2.depth },
          midi: { inputs: midi.inputs, outputs: midi.outputs, profile: midi.profile && midi.profile.name, mode: midi.state.defaults.mode },
          groups: {
            CAMA: groupOf(A, CAM), CAMB: groupOf(B, CAM), SWCH: groupOf(S, SW), SEED: groupOf(SD, SEED), RIG: groupOf(R, RIG),
            MONS: Object.fromEntries([1, 2, 3, 4].flatMap(m => [['hue', M[m].hue], ['sat', M[m].sat], ['brt', M[m].brt], ['con', M[m].con]].map(([k, f]) => [`${m}${k.toUpperCase()}`, +f().toFixed(5)])))
          },
          code: codeBox.value,
          snapshot: midi.snapshot()   // raw "channel:cc" -> value, what midi.restore() takes
        }
        return state
      }
      const dump = () => {
        const state = stateOf()
        const text = JSON.stringify(state, null, 2)
        console.log('[herder] state dump\n' + text)
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { head.textContent = 'state dumped to console and clipboard' }).catch(() => {})
        return state
      }
      // A patch is that JSON in a file. What comes back is the knobs (snapshot), the seed and the sketch
      // code; the picture regrows from the seed. The rest of the file is there to be read.
      const say = (msg) => { note = msg; noteUntil = performance.now() + 4000; console.log('[herder] ' + msg) }
      const applyState = (state) => {
        if (!state || state.page !== 'herder' || !state.snapshot) throw new Error('not a herder patch')
        midi.restore(state.snapshot)
        if (typeof state.code === 'string') { codeBox.value = state.code; try { localStorage.setItem('herder.code', state.code) } catch (e) { /* no storage */ } }
        lastKindKnob = Math.round(SD.kind())
        setSeed((state.seed && state.seed.kind) || seedKind, (state.seed && state.seed.url) || '')   // rebuilds the loops
        if (state.view && views[state.view]) setView(state.view)
        midi.refresh()
      }
      const PATCH_TYPES = [{ description: 'Herder patch', accept: { 'application/json': ['.json'] } }]
      const savePatch = async () => {
        const text = JSON.stringify(stateOf(), null, 2)
        const name = `herder-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.json`
        try {
          if (!window.showSaveFilePicker) throw new Error('no picker')
          const handle = await window.showSaveFilePicker({ id: 'herder', suggestedName: name, types: PATCH_TYPES })
          const w = await handle.createWritable(); await w.write(text); await w.close()
          say('saved ' + handle.name)
        } catch (e) {
          if (e.name === 'AbortError') return
          const a = document.createElement('a')   // no File System Access (or no user gesture): a download
          a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; a.click()
          setTimeout(() => URL.revokeObjectURL(a.href), 1000)
          say('downloaded ' + name)
        }
      }
      const loadPatchFile = async (file) => {
        try { applyState(JSON.parse(await file.text())); say('opened ' + file.name) } catch (e) { say(`could not open ${file.name}: ${e.message}`) }
      }
      const openPatch = async () => {
        try {
          if (!window.showOpenFilePicker) throw new Error('no picker')
          const [handle] = await window.showOpenFilePicker({ id: 'herder', types: PATCH_TYPES })
          loadPatchFile(await handle.getFile())
        } catch (e) {
          if (e.name === 'AbortError') return
          const input = document.createElement('input'); input.type = 'file'; input.accept = '.json,application/json'
          input.onchange = () => { if (input.files[0]) loadPatchFile(input.files[0]) }
          input.click()
        }
      }
      document.addEventListener('dragover', (e) => e.preventDefault())
      document.addEventListener('drop', (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadPatchFile(f) })
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return
        if (e.key === 'd') dump(); if (e.key === 'w') savePatch(); if (e.key === 'o') openPatch()
      })
      window.__herder = { P, midi, get panel () { return panel }, openPanelWindow, closePanelWindow, setSeed, setView, build, dump, stateOf, applyState, savePatch, openPatch, applyCode, codeBox, get seedKind () { return seedKind }, get view () { return view } }
    </script>
  </body>
</html>
