<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hydra frame ring test</title>
    <style>
      body { margin: 0; background: #222; }
      canvas { width: 960px; height: 540px; display: block; }
      #status { position: fixed; top: 4px; left: 4px; color: white; font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.5); padding: 2px 4px; }
    </style>
  </head>
  <body>
    <div id="status">Loading...</div>
    <canvas id="c" width="960" height="540"></canvas>
    <script type="module">
      // mode = core | gl | gpu ; depth = ring size (default 30) ; delay = frames (default depth-1)
      // Shows a 2x2 grid: o0 live clock, o1 = src(o0.delay(k)), o2 = trails via delay, o3 = feedback loop with delay
      const q = new URLSearchParams(location.search)
      const mode = q.get('mode') || 'core'
      const depth = parseInt(q.get('depth') || '30')
      let k = parseInt(q.get('delay') || String(depth - 1))
      const status = document.getElementById('status')
      const canvas = document.getElementById('c')
      try {
        let hydra
        if (mode === 'core') {
          const HydraRenderer = (await import('../src/hydra-synth.js')).default
          hydra = new HydraRenderer({ canvas, width: 960, height: 540, detectAudio: false, makeGlobal: true, numOutputs: 4 })
          await hydra.ready()
        } else {
          const { createHydra } = await import('../extensions/vertex/index-webgpu.js')
          hydra = await createHydra({ canvas, width: 960, height: 540, detectAudio: false, makeGlobal: true, numOutputs: 4, useWGSL: mode === 'gpu' })
        }
        window.__hydra = hydra
        o0.setDepth(depth)
        o3.setDepth(depth)
        // o0: a colour that cycles once a second (hue wheel) plus a bar sweeping left to right once a second
        const ph = (off) => () => 0.5 + 0.5 * Math.sin(2 * Math.PI * (time % 1) + off)
        solid(ph(0), ph(2.094), ph(4.189)).add(shape(4, 0.03, 0.001).scrollX(() => (time % 1) - 0.5), 1).out(o0)
        // o1: o0 as it was k frames ago (at k = 30 of a 60-frame cycle the colour is complementary, bar half a screen back)
        src(o0.delay(() => k)).out(o1)
        // o2: o0 one frame ago (should look identical to o0)
        src(o0.delay(1)).out(o2)
        // o3: delay-line feedback: reads itself k frames back, seeded by the bar
        src(o3.delay(() => k)).scale(0.97).blend(shape(4, 0.03, 0.001).scrollX(() => (time % 1) - 0.5), 0.3).out(o3)
        render()
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowUp') k = Math.min(depth - 1, k + 1)
          if (e.key === 'ArrowDown') k = Math.max(1, k - 1)
          status.textContent = `${mode} depth=${depth} delay=${k}`
        })
        status.textContent = `${mode} depth=${depth} delay=${k} READY`
        window.__delayTest = { get k () { return k }, set k (v) { k = v } }
      } catch (e) {
        console.error(e); status.textContent = 'ERROR: ' + e.message; window.__delayError = e.message
      }
    </script>
  </body>
</html>
