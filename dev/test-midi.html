<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hydra MIDI extension test</title>
    <style>
      body { margin: 0; background: black; color: #ddd; font-family: monospace; font-size: 13px; }
      canvas { width: 100vw; height: 70vh; display: block; }
      #panel { padding: 8px; height: 30vh; overflow: auto; box-sizing: border-box; }
      #log { white-space: pre; color: #9f9; }
      .val { color: #ff9; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1280" height="720"></canvas>
    <div id="panel">
      <div id="inputs">Requesting MIDI access...</div>
      <div>cc0 freq <span class="val" id="v16"></span> &nbsp; cc1 sync <span class="val" id="v17"></span> &nbsp; cc2 rotate <span class="val" id="v18"></span> &nbsp; cc3 kaleid <span class="val" id="v19"></span> &nbsp; push (note 0) <span class="val" id="n16"></span></div>
      <div>Mode: <select id="mode"><option>r2</option><option>abs</option><option>r1</option><option>abs14</option></select> (must match the EC4 encoder Type; any channel) &nbsp; keys: arrows simulate cc0 up/down</div>
      <div id="log"></div>
    </div>
    <script type="module">
      import HydraRenderer from '../src/hydra-synth.js'
      import { install, describeEvent } from '../extensions/midi/index.js'

      const canvas = document.getElementById('c')
      const hydra = new HydraRenderer({ canvas, width: 1280, height: 720, detectAudio: false, makeGlobal: true })
      await hydra.ready()

      const q = new URLSearchParams(location.search)
      const modeSel = document.getElementById('mode')
      modeSel.value = q.get('mode') || 'r2'
      modeSel.onchange = () => { location.search = '?mode=' + modeSel.value }

      const midi = await install(hydra, { mode: modeSel.value, log: false })
      const showInputs = () => {
        document.getElementById('inputs').textContent = 'MIDI inputs: ' + (midi.inputs.length ? midi.inputs.join(', ') : '(none found: plug in the EC4 or use arrow keys)')
      }
      midi.onInputsChanged = showInputs
      midi.ready.then(showInputs)

      const log = document.getElementById('log')
      const lines = []
      midi.state.onEvent(ev => {
        lines.push(describeEvent(ev)); if (lines.length > 8) lines.shift()
        log.textContent = lines.join('\n')
      })

      const freq = midi.cc(0, 2, 80, 12)
      const sync = midi.cc(1, 0, 1, 0.1)
      const rot = midi.cc(2, -3.14, 3.14, 0)
      const kal = midi.cc(3, { min: 1, max: 12, init: 1, steps: 22 })
      const push = midi.note(0, { toggle: true })

      osc(freq, sync, 0.8).kaleid(() => Math.round(kal())).rotate(rot).invert(push).out(o0)

      // Keyboard fallback when no controller is attached: arrows send cc0 in the selected mode
      document.addEventListener('keydown', (e) => {
        const up = e.key === 'ArrowUp' || e.key === 'ArrowRight'
        const down = e.key === 'ArrowDown' || e.key === 'ArrowLeft'
        if (!up && !down) return
        const m = modeSel.value
        let v
        if (m === 'r2') v = up ? 65 : 63
        else if (m === 'r1') v = up ? 127 : 1
        else v = Math.round(Math.min(127, Math.max(0, ((freq() - 2) / 78) * 127 + (up ? 4 : -4))))
        midi.handleMessage([0xB0, 0, v])
      })

      setInterval(() => {
        document.getElementById('v16').textContent = freq().toFixed(2)
        document.getElementById('v17').textContent = sync().toFixed(3)
        document.getElementById('v18').textContent = rot().toFixed(2)
        document.getElementById('v19').textContent = Math.round(kal())
        document.getElementById('n16').textContent = push()
      }, 100)
      window.__midiReady = true
    </script>
  </body>
</html>
