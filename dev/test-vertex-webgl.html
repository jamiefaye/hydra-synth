<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hydra Vertex Extension Test (Core + Install)</title>
    <style>
      body { margin: 0; background: black; }
      canvas { width: 100vw; height: 100vh; }
      #status { position: fixed; top: 10px; left: 10px; color: white; font-family: monospace; z-index: 100; }
      #controls { position: fixed; bottom: 10px; left: 10px; color: white; font-family: monospace; z-index: 100; }
    </style>
  </head>
  <body>
    <div id="status">Loading...</div>
    <div id="controls">
      Press 1-6 to switch patterns (5 = sphere, 6 = bottle)
    </div>
    <script type="module">
      // Test: Core hydra-synth + vertex extension install()
      // This validates the renderer interface works with vertex extension
      import HydraRenderer from '../src/hydra-synth.js'
      import { install } from '../extensions/vertex/index.js'

      window.onload = async () => {
        const status = document.getElementById('status')

        try {
          status.textContent = 'Creating core Hydra...'

          // Create hydra instance using core (with new renderer interface)
          const hydra = new HydraRenderer({
            detectAudio: false,
            makeGlobal: true,
            useWGSL: false
          })

          await hydra.ready()

          // Install vertex extension on top
          status.textContent = 'Installing vertex extension...'
          const success = install(hydra)

          if (!success) {
            throw new Error('Vertex extension install failed')
          }

          // Log info
          console.log('Hydra:', hydra)
          console.log('Renderer:', hydra.renderer)
          console.log('Renderer capabilities:', hydra.renderer.capabilities)
          status.textContent = `Core + Vertex Extension (${hydra.renderer.capabilities.name})`

          // Start with exploding sphere demo
          osc(10, 0.1, 1.5).out(o0,
            sphere(0.4, 32)
              .subdivide({ maxEdgeLength: 0.15 })
              .fragmentize({ groupSize: 2, groupMethod: 'spatial' })
              .explode({
                time: () => (time % 4),  // Loop every 4 seconds
                velocity: 1.5,
                gravity: [0, 0.5, 0],  // Positive Y = down in this coord system
                spin: 2.0,
                shockSpeed: 3.0
              })
              .perspective(60)
              .rotateY(() => time * 0.2)
          )

          // Keyboard controls
          document.addEventListener('keydown', (e) => {
            switch (e.key) {
              case '1':
                // 2D pattern
                osc(10, 0.1, 1).out(o0)
                status.textContent = 'Pattern 1: osc (2D)'
                break
              case '2':
                // 2D with modulation
                osc(20, 0.05, 1.5).rotate(0.1).modulate(noise(3), 0.2).out(o0)
                status.textContent = 'Pattern 2: osc + noise (2D)'
                break
              case '3':
                // 3D - simple sphere
                osc(10).out(o0, sphere().perspective(60).rotateY(() => time))
                status.textContent = 'Pattern 3: sphere (3D)'
                break
              case '4':
                // 3D - cube with texture
                noise(5).colorama(0.5).out(o0, cube().perspective(60).rotateX(() => time * 0.5).rotateY(() => time))
                status.textContent = 'Pattern 4: textured cube (3D)'
                break
              case '5':
                // 3D - exploding sphere
                osc(10, 0.1, 1.5).out(o0,
                  sphere(0.4, 32)
                    .subdivide({ maxEdgeLength: 0.15 })
                    .fragmentize({ groupSize: 2, groupMethod: 'spatial' })
                    .explode({
                      time: () => (time % 4),  // Loop every 4 seconds
                      velocity: 1.5,
                      gravity: [0, 0.5, 0],  // Positive Y = down
                      spin: 2.0,
                      shockSpeed: 3.0
                    })
                    .perspective(60)
                    .rotateY(() => time * 0.2)
                )
                status.textContent = 'Pattern 5: exploding sphere (3D)'
                break
              case '6':
                // 3D - exploding bottle model
                status.textContent = 'Loading bottle...'
                loadGlb('/UltimateFoodPack/Bottle.glb').then(bottle => {
                  osc(5, 0.1, 1).out(o0,
                    bottle
                      .subdivide({ maxEdgeLength: 0.1 })
                      .fragmentize({ groupSize: 3, groupMethod: 'spatial' })
                      .explode({
                        time: () => Math.max(0, (time % 7) - 2),  // 2s delay, 5s explosion, 7s loop
                        velocity: 1.2,
                        gravity: [0, 0.8, 0],
                        spin: 1.5,
                        shockSpeed: 4.0
                      })
                      .rotateX(Math.PI / 2)  // Rotate bottle upright
                      .perspective(60)
                      .rotateY(() => time * 0.3)
                  )
                  status.textContent = 'Pattern 6: exploding bottle (3D)'
                })
                break
            }
          })

          console.log('Hydra + Vertex initialized successfully')
          status.textContent += ' - Press 1-6 (5: sphere explosion, 6: bottle explosion)'

        } catch (e) {
          console.error('Error:', e)
          status.textContent = 'Error: ' + e.message
        }
      }
    </script>
  </body>
</html>
