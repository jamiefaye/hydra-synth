<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hydra WebGL Renderer Test (Core)</title>
    <style>
      body { margin: 0; background: black; }
      canvas { width: 100vw; height: 100vh; }
      #status { position: fixed; top: 10px; left: 10px; color: white; font-family: monospace; z-index: 100; }
      #controls { position: fixed; bottom: 10px; left: 10px; color: white; font-family: monospace; z-index: 100; }
    </style>
  </head>
  <body>
    <div id="status">Loading...</div>
    <div id="controls">
      1-4: pattern on o0 &nbsp; 0: grid / cycle o0..o5 &nbsp; r/c: row or column order
    </div>
    <script type="module">
      // Test core hydra-synth with WebGL1Renderer
      import HydraRenderer from '../src/hydra-synth.js'

      window.onload = async () => {
        const status = document.getElementById('status')

        try {
          status.textContent = 'Creating Hydra with WebGL...'

          // Create hydra instance with default WebGL mode
          const hydra = new HydraRenderer({
            detectAudio: false,
            makeGlobal: true,
            numOutputs: 6,
            useWGSL: false  // Ensure WebGL mode
          })

          // Wait for initialization
          await hydra.ready()

          // Log renderer info
          console.log('Hydra:', hydra)
          console.log('Renderer:', hydra.renderer)
          console.log('Renderer capabilities:', hydra.renderer.capabilities)
          console.log('Shader language:', hydra.renderer.shaderLanguage)
          status.textContent = `Renderer: ${hydra.renderer.capabilities.name} (${hydra.renderer.shaderLanguage})`


          // Six outputs, one pattern each, shown as a grid (render() with no argument)
          osc(10, 0.1, 1).out(o0)
          noise(4).colorama(0.3).out(o1)
          shape(5, 0.4, 0.05).rotate(() => time * 0.2).out(o2)
          gradient(0.3).out(o3)
          voronoi(6, 0.5).out(o4)
          osc(30, 0.05, 0.8).kaleid(5).out(o5)
          render()
          let single = -1   // -1 = grid, else index of the output shown alone

          // Keyboard controls for testing patterns
          document.addEventListener('keydown', (e) => {
            switch (e.key) {
              case '0':
                // Toggle grid <-> cycle through single outputs o0..o5
                single = single + 1
                if (single >= 6) { single = -1; render(); status.textContent = 'render(): all 6 outputs' }
                else { render(window['o' + single]); status.textContent = 'render(o' + single + ')' }
                break
              case 'r':
                setGridLayout({ order: 'row' }); status.textContent = 'grid order: row'
                break
              case 'c':
                setGridLayout({ order: 'column' }); status.textContent = 'grid order: column (default)'
                break
              case '1':
                osc(10, 0.1, 1).out(o0)
                status.textContent = 'Pattern 1: osc'
                break
              case '2':
                osc(20, 0.05, 1.5).rotate(0.1).modulate(noise(3), 0.2).out(o0)
                status.textContent = 'Pattern 2: osc + noise modulation'
                break
              case '3':
                noise(10).colorama(0.5).out(o0)
                status.textContent = 'Pattern 3: noise colorama'
                break
              case '4':
                gradient(0.5).rotate(() => time * 0.1).out(o0)
                status.textContent = 'Pattern 4: rotating gradient'
                break
            }
          })

          console.log('Hydra WebGL initialized successfully')
          status.textContent += ' - 6 outputs, render() grid. Press 0 to cycle, 1-4 for patterns on o0'

        } catch (e) {
          console.error('Error:', e)
          status.textContent = 'Error: ' + e.message
        }
      }
    </script>
  </body>
</html>
