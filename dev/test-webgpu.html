<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hydra WebGPU Renderer Test</title>
    <style>
      body { margin: 0; background: black; }
      canvas { width: 100vw; height: 100vh; }
      #status { position: fixed; top: 10px; left: 10px; color: white; font-family: monospace; z-index: 100; }
      #controls { position: fixed; bottom: 10px; left: 10px; color: white; font-family: monospace; z-index: 100; }
    </style>
  </head>
  <body>
    <div id="status">Loading...</div>
    <div id="controls">
      1-7: pattern on o0 &nbsp; 0: grid / cycle o0..o5 &nbsp; r/c: row or column order
    </div>
    <script type="module">
      // Use the vertex extension's createHydra which has full WGSL support
      import { createHydra } from '../extensions/vertex/index-webgpu.js'

      window.onload = async () => {
        const status = document.getElementById('status')

        try {
          // Check WebGPU support
          if (!navigator.gpu) {
            status.textContent = 'WebGPU not supported in this browser'
            return
          }

          status.textContent = 'Creating Hydra with WebGPU...'

          // Create hydra instance with WebGPU mode via vertex extension
          const hydra = await createHydra({
            detectAudio: false,
            makeGlobal: true,
            numOutputs: 6,
            useWGSL: true
          })

          // Log renderer info
          console.log('Hydra:', hydra)
          console.log('wgslHydra:', hydra.wgslHydra)
          status.textContent = `Renderer: WebGPU (WGSL)`


          // Six outputs, one pattern each, shown as a grid (render() with no argument)
          osc(10, 0.1, 1).out(o0)
          noise(4).colorama(0.3).out(o1)
          shape(5, 0.4, 0.05).rotate(() => time * 0.2).out(o2)
          gradient(0.3).out(o3)
          voronoi(6, 0.5).out(o4)
          osc(30, 0.05, 0.8).kaleid(5).out(o5)
          render()
          let single = -1   // -1 = grid, else index of the output shown alone

          // Keyboard controls for testing patterns
          document.addEventListener('keydown', (e) => {
            switch (e.key) {
              case '0':
                // Toggle grid <-> cycle through single outputs o0..o5
                single = single + 1
                if (single >= 6) { single = -1; render(); status.textContent = 'render(): all 6 outputs' }
                else { render(window['o' + single]); status.textContent = 'render(o' + single + ')' }
                break
              case 'r':
                setGridLayout({ order: 'row' }); status.textContent = 'grid order: row'
                break
              case 'c':
                setGridLayout({ order: 'column' }); status.textContent = 'grid order: column (default)'
                break
              case '1':
                osc(10, 0.1, 1).out(o0)
                status.textContent = 'Pattern 1: osc'
                break
              case '2':
                osc(20, 0.05, 1.5).rotate(0.1).modulate(noise(3), 0.2).out(o0)
                status.textContent = 'Pattern 2: osc + noise modulation'
                break
              case '3':
                noise(10).colorama(0.5).out(o0)
                status.textContent = 'Pattern 3: noise colorama'
                break
              case '4':
                gradient(0.5).rotate(() => time * 0.1).out(o0)
                status.textContent = 'Pattern 4: rotating gradient'
                break
              case '5':
                // Test texture sources - render to o1, then use src(o1) in o0
                osc(10, 0.1, 1).out(o1)
                src(o1).modulate(noise(3), 0.1).rotate(0.1).out(o0)
                status.textContent = 'Pattern 5: texture source (src(o1))'
                break
              case '6':
                // Test external image + 3D geometry + sprite sheet
                hush()
                s0.initImage('https://raw.githubusercontent.com/jamiefaye/hydra-models/main/test-grid-4x4.png')
                src(s0).out(o0, cube(0.4).rotateY(() => hydra.synth.time).rotateX(() => hydra.synth.time * 0.7).perspective(45), { level: 0, sprite: { cols: 4, rows: 4 } })
                status.textContent = 'Pattern 6: image texture on 3D cube'
                break
              case '7':
                // Simpler test - just src(s0) fullscreen
                hush()
                s0.initImage('https://raw.githubusercontent.com/jamiefaye/hydra-models/main/test-grid-4x4.png')
                src(s0).out(o0)
                status.textContent = 'Pattern 7: simple src(s0) test'
                break
            }
          })

          console.log('Hydra WebGPU initialized successfully')
          status.textContent += ' - 6 outputs, render() grid. Press 0 to cycle, 1-7 for patterns on o0'

        } catch (e) {
          console.error('Error:', e)
          status.textContent = 'Error: ' + e.message
        }
      }
    </script>
  </body>
</html>
